/* ===== 2. 積分速率式：哪一種圖是直線 ===== */
W.order = el => {
  const st = { n: 1, k: 0.2 }, A0 = 1, T = 20;
  el.innerHTML = `${seg('orS', [['0', '零級'], ['1', '一級'], ['2', '二級']], '1')}<div class="w-row"><label class="rng">速率常數 k <input type="range" id="ork" min="0.02" max="0.5" step="0.01"><output class="mono" id="oro"></output></label></div><div class="og" id="orG"></div><div class="cards" id="orK"></div><p class="note" id="orN"></p>`;
  const Af = t => st.n === 0 ? Math.max(1e-4, A0 - st.k * t * 0.1) : st.n === 1 ? A0 * Math.exp(-st.k * t) : 1 / (1 / A0 + st.k * t);
  function draw() {
    const ts = Array.from({ length: 101 }, (_, i) => i * T / 100), k = st.n === 0 ? st.k * 0.1 : st.k;
    const half = st.n === 0 ? A0 / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * A0);
    const hs = []; let a = A0, t = 0; for (let i = 0; i < 4; i++) { const h = st.n === 0 ? a / (2 * k) : st.n === 1 ? Math.LN2 / k : 1 / (k * a); t += h; a /= 2; if (t > T) break; hs.push([t, h]); }
    const plots = [['[A]', v => v, [0, 1], '[A] 對時間'], ['ln[A]', v => Math.log(v), [-5, 0], 'ln[A] 對時間'], ['1/[A]', v => 1 / v, [0, 12], '1/[A] 對時間']];
    $('#orG', el).innerHTML = plots.map(([lab, f, yr, ttl], i) => {
      const straight = i === st.n;
      return `<div class="${straight ? 'og-on' : ''}"><p class="lbl">${ttl}${straight ? '　← 直線' : ''}</p>${chart({ x: [0, T], y: yr, xt: [0, 10, 20], yt: yr, xlab: '時間', ylab: lab, h: 190, w: 300 }, (X, Y) => `<path class="${straight ? 'tline' : 'tline2'}" d="${path(ts.map(t => [X(t), Y(clamp(f(Af(t)), yr[0], yr[1]))]))}"/>${i === 0 ? hs.map(([tt]) => `<line class="mk" x1="${X(tt)}" x2="${X(tt)}" y1="${Y(0)}" y2="${Y(1)}"/>`).join('') : ''}`)}</div>`;
    }).join('');
    $('#orK', el).innerHTML = card('h', '第一個半生期', fx(half, 2)) + card('h2', '連續半生期', hs.map(h => fx(h[1], 1)).join('、') || '—');
    $('#orN', el).innerHTML = [
      `<b>零級</b>：rate = k，速率和濃度無關，[A] 隨時間<b>直線</b>下降：[A] = [A]₀ − kt。半生期 t½ = [A]₀ ÷ 2k，濃度越低半生期越短。常見於酵素飽和、表面催化。`,
      `<b>一級</b>：rate = k[A]，<b>ln[A] 對時間是直線</b>，斜率 −k：ln[A] = ln[A]₀ − kt。半生期 <b>t½ = 0.693 ÷ k</b>，和起始濃度無關，所以連續的半生期都一樣長（左圖的虛線等間隔）。放射性衰變、多數藥物排除都是一級。`,
      `<b>二級</b>：rate = k[A]²，<b>1/[A] 對時間是直線</b>，斜率 k：1/[A] = 1/[A]₀ + kt。半生期 t½ = 1 ÷ (k[A]₀)，濃度越低半生期越長。`][st.n] + ' 判斷級數的方法：把數據畫成三種圖，哪一種是直線，就是幾級。';
    $('#oro', el).textContent = fx(st.k); $('#ork', el).value = st.k; pressSeg(el, 'orS', String(st.n));
  }
  bindSeg(el, 'orS', v => { st.n = +v; draw(); });
  $('#ork', el).oninput = e => { st.k = +e.target.value; draw(); };
  draw();
  return { set(s) { if (s.n != null) st.n = s.n; draw(); } };
};

/* ===== 3. 活化能與溫度：能量分佈的尾巴 ===== */

      `<path class="area" d="${path([[X(Ea), Y(-14)], ...es.filter(e => e >= Ea).map(e => [X(e), Y(lg(dens(e, st.T)))]), [X(Emax), Y(-14)]])}Z"/><path class="tline2" d="${path(es.map(e => [X(e), Y(lg(dens(e, 298)))]))}"/><path class="tline" d="${path(es.map(e => [X(e), Y(lg(dens(e, st.T)))]))}"/><line class="cur" x1="${X(Ea)}" x2="${X(Ea)}" y1="${Y(-14)}" y2="${Y(0)}"/><text class="tk" x="${X(Ea) + 4}" y="${Y(-1)}">Ea</text><text class="tk" x="${X(Emax) - 4}" y="${Y(-0.6)}" text-anchor="end">藍：${st.T} K　灰虛線：298 K</text>`);

    $('#arN', el).innerHTML = `阿瑞尼斯方程式 k = A e<sup>−Ea/RT</sup>：只有能量超過 Ea 的碰撞才能反應。這些分子在分佈的<b>尾巴</b>上，所以溫度稍微升高，尾巴就抬高很多（縱軸是對數刻度）。Ea = ${Ea} kJ/mol 時，在 ${st.T} K 每升溫 10 K，速率約變為 ${fx(r10, 1)} 倍。${st.cat ? '催化劑提供另一條活化能較低的路徑，速率大增；但它同時加快正逆反應，<b>不改變平衡常數</b>。' : ''}`;

/* ===== 4. 多步驟反應：速率決定步驟 ===== */
W.rds = el => {
  const st = { h1: 0.85, h2: 0.65 };
  el.innerHTML = `<p class="eq">步驟 1：A ⇌ I（中間物）　　步驟 2：I + B → P</p><div class="w-row"><label class="rng">過渡狀態 1 的高度 <input type="range" id="rd1" min="0.62" max="0.95" step="0.01"></label><label class="rng">過渡狀態 2 的高度 <input type="range" id="rd2" min="0.62" max="0.95" step="0.01"></label></div><div class="bgrid"><div id="rdE"></div><div><div class="verdict" id="rdV"></div></div></div><p class="note" id="rdN"></p>`;
  function draw() {
    const one = st.h1 >= st.h2;
    $('#rdE', el).innerHTML = energySVG([[0, 0.3], [0.25, st.h1], [0.5, 0.55], [0.75, st.h2], [1, 0.1]], null, { labels: [[0.25, '過渡狀態 1'], [0.5, '中間物 I', 14], [0.75, '過渡狀態 2']], w: 320, h: 170 });
    $('#rdV', el).innerHTML = `<span class="lbl">速率決定步驟</span><b class="big">步驟 ${one ? 1 : 2}</b><span class="lbl">速率式</span><b>${one ? 'rate = k₁[A]' : 'rate = k₂K₁[A][B]'}</b>`;
    $('#rdN', el).innerHTML = one ? '過渡狀態 1 最高，第一步最慢：中間物一生成就被很快消耗，整體速率由第一步決定，<b>只和 A 有關</b>，B 的濃度不影響速率。SN1 就是這種情況（RX 先解離，親核基再快速加上）。'
      : '過渡狀態 2 最高，第二步最慢：第一步很快達到平衡（[I] = K₁[A]），整體速率 = k₂[I][B] = k₂K₁[A][B]，<b>A 和 B 都出現在速率式中</b>。快速平衡之後的慢步驟，速率式會包含它之前所有步驟的反應物。';
    $('#rd1', el).value = st.h1; $('#rd2', el).value = st.h2;

  $('#rd2', el).oninput = e => { st.h2 = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

    $('#fcN', el).innerHTML = `形式電荷 = 價電子 − 非鍵電子 − 鍵數 = ${v} − ${2 * st.lp} − ${st.b} = <b>${fc}</b>。${common ? `這是<b>${common}</b>。` : ''}${e > 8 && st.e !== 'X' ? '<span class="bad">第二週期元素周圍超過 8 個電子，不可能存在。</span>' : ''}<br>記住常見組合就不用每次算：碳 4 鍵中性、3 鍵帶電；氮 3 鍵中性、4 鍵 +1；氧 2 鍵中性、3 鍵 +1、1 鍵 −1。`;
    pressSeg(el, 'fcE', st.e); $$('[data-b]', el).forEach(b => b.classList.toggle('pri', +b.dataset.b === st.b)); $$('[data-l]', el).forEach(b => b.classList.toggle('pri', +b.dataset.l === st.lp));

/* ===== 4. 用 pKa 預測酸鹼反應方向 ===== */
const PKA = [
  ['HCl', 'Cl⁻', -7], ['H₃O⁺', 'H₂O', -1.7], ['CH₃COOH', 'CH₃COO⁻', 4.76], ['H₂CO₃', 'HCO₃⁻', 6.35], ['NH₄⁺', 'NH₃', 9.25], ['C₆H₅OH（酚）', 'C₆H₅O⁻', 10.0],
  ['H₂O', 'OH⁻', 15.7], ['CH₃CH₂OH', 'CH₃CH₂O⁻', 16], ['HC≡CH', 'HC≡C⁻', 25], ['NH₃', 'NH₂⁻', 38], ['CH₃CH₃', 'CH₃CH₂⁻', 50],
];
W.pkaeq = el => {
  let ia = 8, ib = 6;
  const PRE = [['NaOH 能拿走乙炔的 H 嗎？', 8, 6], ['NaNH₂ 呢？', 8, 9], ['碳酸氫鈉能溶解醋酸嗎？', 2, 3], ['碳酸氫鈉能溶解酚嗎？', 5, 3], ['乙醇與 NaOH', 7, 6]];
  el.innerHTML = `<div class="w-row"><span class="small mut">試試：</span>${PRE.map((p, i) => `<button class="btn sm ghost" type="button" data-p="${i}">${p[0]}</button>`).join('')}</div>
<div class="w-row"><label class="sel">酸 HA <select id="pkA">${PKA.map((p, i) => `<option value="${i}">${p[0]}（pKa ${p[2]}）</option>`).join('')}</select></label><label class="sel">鹼 B⁻ <select id="pkB">${PKA.map((p, i) => `<option value="${i}">${p[1]}（共軛酸 pKa ${p[2]}）</option>`).join('')}</select></label></div><div id="pkR"></div><div id="pkS"></div><p class="note" id="pkN"></p>`;
  function draw() {
    const A = PKA[ia], B = PKA[ib], d = B[2] - A[2], K = 10 ** d, right = d > 0;
    $('#pkA', el).value = ia; $('#pkB', el).value = ib;
    $('#pkR', el).innerHTML = `<p class="eq">${A[0]} + ${B[1]} ${right ? '<b>⟶</b>' : '⟵'} ${A[1]} + ${B[0]}<br><span class="small">pKa ${A[2]}　　　　　　　　　pKa ${B[2]}</span></p>`;
    $('#pkS', el).innerHTML = chart({ x: [-10, 52], y: [0, 1], xt: [-10, 0, 10, 20, 30, 40, 50], yt: [], xlab: 'pKa（越左酸越強；共軛鹼越右越強）', h: 130 }, (X, Y) => PKA.map((p, i) => { const on = i === ia || i === ib, y = Y(0.25 + 0.55 * ((i % 3) / 2)); return `<line class="mk" x1="${X(p[2])}" x2="${X(p[2])}" y1="${Y(0)}" y2="${y}"/><circle class="${on ? 'dot' : 'dot3'}" cx="${X(p[2])}" cy="${y}" r="${on ? 6 : 4}"/><text class="tk${on ? ' hl' : ''}" x="${X(p[2])}" y="${y - 9}" text-anchor="middle">${p[0].replace(/（.*）/, '')}</text>`; }).join(''));
    $('#pkN', el).innerHTML = ia === ib ? '選兩個不同的物種。' : `平衡常數 K = 10<sup>(pKa 右邊的酸 − pKa 左邊的酸)</sup> = 10<sup>${fx(d, 2)}</sup> ≈ ${sci(K, 1)}。平衡偏向<b>較弱的酸（pKa 較大）那一側</b>：${right ? `${B[0]}（${B[2]}）比 ${A[0]}（${A[2]}）弱，所以反應<b>向右</b>，${B[1]} 可以把 ${A[0]} 的 H⁺ 拿走。` : `${A[0]}（${A[2]}）比 ${B[0]}（${B[2]}）弱，反應<b>幾乎不往右走</b>：${B[1]} 不夠強，拿不走 ${A[0]} 的 H⁺。`}`;
  }
  $('#pkA', el).onchange = e => { ia = +e.target.value; draw(); };
  $('#pkB', el).onchange = e => { ib = +e.target.value; draw(); };
  $$('[data-p]', el).forEach(b => { b.onclick = () => { const p = PRE[+b.dataset.p]; ia = p[1]; ib = p[2]; draw(); }; });

};

/* ---------- 後中化學：立體化學與構形的互動圖 ----------
   掌性中心以四面體的四個位置表示：上（紙面）、右（紙面）、楔形（朝向讀者）、虛楔（遠離讀者）。
   構型一律由三維向量計算：優先順序 1、2、3 的向量 v1·(v2 × v3) < 0 為 R，> 0 為 S（不靠記憶規則，避免畫錯）。 */
const TET = { up: [0, 1, 0], right: [0.94, -0.33, 0], wedge: [-0.47, -0.33, 0.82], dash: [-0.47, -0.33, -0.82] };
const POS2 = { up: [0, 1.1], right: [1.0, -0.38], wedge: [-0.85, -0.52], dash: [-0.22, -1.02] };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const chir = (v1, v2, v3) => (dot3(v1, cross(v2, v3)) < 0 ? 'R' : 'S');
// slots：{ 位置: 基團索引 }；pri：各基團優先順序（1 最高）
function centerScene(labels, slots, mirror = false, hl = {}) {
  const atoms = { C: { x: 0, y: 0, t: 'C' } }, bonds = [];
  for (const [pos, gi] of Object.entries(slots)) {
    const [x, y] = POS2[pos], id = 'g' + gi; atoms[id] = { x: mirror ? -x : x, y, t: labels[gi], hl: hl[gi] ? 1 : 0 };
    bonds.push(['C', id, pos === 'wedge' ? 'w' : pos === 'dash' ? 'h' : 's']);
  }
  return { atoms, bonds };
}

const FV = { up: [0, 1, -1], down: [0, -1, -1], left: [-1, 0, 1], right: [1, 0, 1] };

/* ===== 4. 丁烷的構形與能量 ===== */
W.butane = el => {
  let ang = 180;
  // 相對能量（kJ/mol，McMurry）：反式 0、間扭式 3.8、CH₃/H 重疊 16、CH₃/CH₃ 重疊 19
  const PTS = [[0, 19], [60, 3.8], [120, 16], [180, 0], [240, 16], [300, 3.8], [360, 19]];
  const E = a => { a = ((a % 360) + 360) % 360; for (let i = 0; i < 6; i++) { const [a0, e0] = PTS[i], [a1, e1] = PTS[i + 1]; if (a <= a1) { const t = (a - a0) / (a1 - a0); return e0 + (e1 - e0) * (1 - Math.cos(Math.PI * t)) / 2; } } return 19; };
  const NAME = a => ({ 0: '全重疊式（CH₃ 與 CH₃ 重疊）', 60: '間扭式（gauche）', 120: '重疊式（CH₃ 與 H 重疊）', 180: '反式（anti）', 240: '重疊式（CH₃ 與 H 重疊）', 300: '間扭式（gauche）', 360: '全重疊式（CH₃ 與 CH₃ 重疊）' }[a]);
  el.innerHTML = `<div class="w-row"><label class="rng">轉動後碳（CH₃–C–C–CH₃ 二面角）<input type="range" id="buA" min="0" max="360" step="5"><output class="mono" id="buO"></output></label></div><div class="ngrid"><div id="buN"></div><div id="buE"></div></div><p class="note" id="buT"></p>`;
  function draw() {
    const cx = 130, cy = 120, R = 48, L = 92, P = (a, r) => [cx + Math.cos(a * Math.PI / 180) * r, cy - Math.sin(a * Math.PI / 180) * r];
    const front = [[90, 'CH₃', 'hl'], [210, 'H', ''], [330, 'H', '']], back = [[90 - ang, 'CH₃', 'br'], [210 - ang, 'H', ''], [330 - ang, 'H', '']];
    const bl = ([a, t, c]) => { const [x1, y1] = P(a, R), [x2, y2] = P(a, L), [tx, ty] = P(a, L + 16); return `<line class="nb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    const fl = ([a, t, c]) => { const [x2, y2] = P(a, L - 12), [tx, ty] = P(a, L + 4); return `<line class="nb" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    $('#buN', el).innerHTML = `<svg viewBox="0 0 260 245" class="mol" role="img" aria-label="丁烷紐曼投影">${back.map(bl).join('')}<circle class="nc" cx="${cx}" cy="${cy}" r="${R}"/>${front.map(fl).join('')}</svg>`;
    const xs = Array.from({ length: 73 }, (_, i) => i * 5);
    $('#buE', el).innerHTML = chart({ x: [0, 360], y: [0, 20], xt: [0, 60, 120, 180, 240, 300, 360], yt: [0, 3.8, 16, 19], xlab: '二面角（°）', ylab: '相對能量（kJ/mol）', h: 230, label: '丁烷構形能量' }, (X, Y) => `<path class="tline" d="${path(xs.map(a => [X(a), Y(E(a))]))}"/><circle class="dot" cx="${X(ang)}" cy="${Y(E(ang))}" r="7"/>`);
    const d = ang % 360 === 0 && ang ? 360 : ang, nm = NAME(d);
    $('#buT', el).innerHTML = `二面角 ${ang}°，相對能量 ${fx(E(ang), 1)} kJ/mol${nm ? `：<b>${nm}</b>` : ''}。` + (nm ? { 0: '兩個甲基正面相撞（立體張力）加上鍵電子互斥（扭轉張力），能量最高。', 60: '交錯式，但兩個甲基相鄰，有一點立體擁擠：比反式高 3.8 kJ/mol。', 120: '重疊式：鍵與鍵正對，扭轉張力大。', 180: '兩個甲基離得最遠，而且是交錯式：<b>能量最低、最穩定</b>，室溫下大部分丁烷分子處在這個構形。', 240: '重疊式：鍵與鍵正對，扭轉張力大。', 300: '交錯式，但兩個甲基相鄰：比反式高 3.8 kJ/mol。', 360: '兩個甲基正面相撞，能量最高。' }[d] : '介於兩種構形之間。室溫下 C–C 單鍵轉得很快（每秒數十億次），這些構形不能分離，只是出現的機率不同。');
    $('#buO', el).textContent = `${ang}°`; $('#buA', el).value = ang;
  }

  draw();
  return { set(s) { ang = s.ang ?? ang; draw(); } };
};

/* ===== 5. 環己烷椅式：直立鍵與平伏鍵 ===== */
W.chair = el => {
  let sub = 'me', f = 1, anim = 0;
  const SUB = { me: { t: 'CH₃', dG: 7.6 }, tbu: { t: 'C(CH₃)₃', dG: 22.8 } };
  el.innerHTML = `${seg('chairS', [['me', '甲基環己烷'], ['tbu', '第三丁基環己烷']], sub)}<div class="w-row"><button class="btn sm pri" type="button" id="chF">環翻轉 ⇄</button></div><div id="chairV"></div><div class="cards" id="chairK"></div><p class="note" id="chairN"></p>`;
  const r = 1.35, h = 0.3, S = 62, cx = 190, cy = 115;
  function geo(fl) {
    return Array.from({ length: 6 }, (_, k) => { const t = k * Math.PI / 3, x = r * Math.cos(t), y = r * Math.sin(t), z = fl * (k % 2 ? -1 : 1) * h; return { x, y, z, t, sx: cx + x * S, sy: cy - (0.32 * y + z) * S }; });
  }
  function draw() {
    const P = geo(f), axUp = f > 0, A = 0.85 * S;
    const ring = P.map((p, i) => { const q = P[(i + 1) % 6]; return `<line class="b" x1="${p.sx}" y1="${p.sy}" x2="${q.sx}" y2="${q.sy}"/>`; }).join('');
    const p0 = P[0], ax = [p0.sx, p0.sy - Math.sign(f || 1) * A * Math.abs(f)], eq = [p0.sx + A * 0.95, p0.sy - (-0.33 * Math.sign(f || 1)) * A * 0.5];
    const t = (1 - f) / 2, sp = [ax[0] + (eq[0] - ax[0]) * t, ax[1] + (eq[1] - ax[1]) * t], hp = [eq[0] + (ax[0] - eq[0]) * t, eq[1] + (ax[1] - eq[1]) * t];
    const axial = f > 0.2;
    const hs = [2, 4].map(k => { const p = P[k], y2 = p.sy - Math.sign(f || 1) * A * 0.7 * Math.abs(f); return `<line class="b" x1="${p.sx}" y1="${p.sy}" x2="${p.sx}" y2="${y2}"/><text class="at${axial ? ' hl' : ''}" x="${p.sx}" y="${y2 - 6}" text-anchor="middle">H</text>${axial ? `<line class="clash" x1="${p.sx}" y1="${y2}" x2="${sp[0] - 14}" y2="${sp[1]}"/>` : ''}`; }).join('');
    $('#chairV', el).innerHTML = `<svg viewBox="0 0 380 230" class="mol" role="img" aria-label="環己烷椅式">${ring}${hs}<line class="b" x1="${p0.sx}" y1="${p0.sy}" x2="${sp[0]}" y2="${sp[1]}"/><text class="at br" x="${sp[0] + (axial ? 0 : 30)}" y="${sp[1] + (axial ? -8 : 6)}" text-anchor="middle">${SUB[sub].t}</text><line class="b" x1="${p0.sx}" y1="${p0.sy}" x2="${hp[0]}" y2="${hp[1]}"/><text class="at" x="${hp[0] + (axial ? 12 : 0)}" y="${hp[1] + (axial ? 6 : -8)}" text-anchor="middle">H</text><text class="tk" x="${cx}" y="222" text-anchor="middle">${Math.abs(f) < 0.99 ? '翻轉中…' : axial ? '取代基在直立鍵（axial）' : '取代基在平伏鍵（equatorial）'}</text></svg>`;
    const d = SUB[sub].dG, ratio = Math.exp(d * 1000 / (8.314 * 298)), pe = 100 * ratio / (1 + ratio);
    $('#chairK', el).innerHTML = card('dg', '直立比平伏高', `${d} kJ/mol`) + card('pe', '平衡時平伏鍵構形', `${pe > 99.9 ? '> 99.9' : fx(pe, 1)}%`);
    $('#chairN', el).innerHTML = axial ? `取代基在<b>直立鍵</b>：它和同一側、隔一個碳的兩個直立 H（C3、C5，紅色）靠得很近，這叫 <b>1,3-雙直立作用</b>。按「環翻轉」，所有直立鍵和平伏鍵互換。`
      : `取代基在<b>平伏鍵</b>，指向環的外側，沒有 1,3-雙直立作用，比較穩定。${sub === 'me' ? '甲基' : '第三丁基'}在直立鍵時多出 ${d} kJ/mol 的能量，所以 25 °C 時約 ${pe > 99.9 ? '超過 99.9' : fx(pe, 0)}% 的分子處在平伏鍵構形。${sub === 'tbu' ? '第三丁基太大，等於把環「鎖」在這個構形。' : ''}`;
    pressSeg(el, 'chairS', sub);
  }
  function flip() {
    cancelAnimationFrame(anim); const f0 = f, f1 = f > 0 ? -1 : 1, t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { f = f1; draw(); return; }
    const tick = now => { const t = Math.min(1, (now - t0) / 900); f = f0 + (f1 - f0) * (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2); draw(); if (t < 1) anim = requestAnimationFrame(tick); else { f = f1; draw(); } };
    anim = requestAnimationFrame(tick);
  }
  bindSeg(el, 'chairS', v => { sub = v; draw(); });
  $('#chF', el).onclick = flip;
  draw();
  return { set(s) { if (s.sub) sub = s.sub; if (s.axial != null) f = s.axial ? 1 : -1; draw(); } };
};

    if (!ready) return `<p class="cp-t">${T('連線中…', 'Connecting…')}</p>`;
    const n = nDone(), tot = COURSE.total(), e = err ? `<p class="cp-err">${esc(err)}</p>` : '';
    if (!user) return `<p class="cp-t">${T('在不同裝置接著學', 'Pick up where you left off on any device')}</p>
<p>${T('用 Google 帳號登入後，你完成的章節會存到雲端。之後在手機或其他電腦登入同一個帳號，進度會自動接上。', 'Sign in with Google and the chapters you finish are saved to the cloud. Sign in with the same account on your phone or another computer and your progress follows you.')}</p>
<p class="cp-st">${T(`目前：進度只存在這台裝置（已完成 ${n} / ${tot} 章）`, `Now: progress is saved on this device only (${n} / ${tot} chapters done)`)}</p>
<button class="btn pri cp-go" type="button" id="cpIn">${G}<span>${T('用 Google 登入', 'Sign in with Google')}</span></button>
<p class="cp-s">${T('不登入也能使用全部內容。這裡只儲存「完成了哪些章節」，不會讀取你的其他 Google 資料。', 'Everything works without signing in. Only the list of finished chapters is stored, nothing else from your Google account.')}</p>${e}`;
    return `<p class="cp-t">${user.photoURL ? `<img class="cp-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}<span>${esc(user.displayName || T('已登入', 'Signed in'))}<small>${esc(user.email || '')}</small></span></p>
<p class="cp-st ok">${busy ? T('同步中…', 'Syncing…') : `✓ ${T(`已同步 ${n} / ${tot} 章`, `${n} / ${tot} chapters synced`)}${last ? ` · ${time(last)}` : ''}`}</p>
<p>${T('在其他裝置用同一個帳號登入，就會看到相同的進度；在任何一台標記完成，其他裝置也會跟著更新。', 'Sign in with the same account on another device to see the same progress. Chapters you finish anywhere show up everywhere.')}</p>
<button class="btn" type="button" id="cpOut">${T('登出', 'Sign out')}</button>
<p class="cp-s" style="margin-top:8px !important">${T('登出後，這台裝置上的進度仍會保留。', 'Signing out keeps your progress on this device.')}</p>${e}`;
  }
  function render() {
    const b = document.getElementById('cloudBtn'), p = document.getElementById('cloudPanel');
    if (b) {
      b.innerHTML = user ? `${user.photoURL ? `<img class="cb-av" src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer">` : '<span class="cb-dot"></span>'}<span>${busy ? T('同步中', 'Syncing') : T('已同步', 'Synced')}</span>` : `<span aria-hidden="true">☁</span><span>${T('同步進度', 'Sync progress')}</span>`;
      b.title = user ? T('進度已同步到雲端，點一下看詳情', 'Progress is synced; click for details') : T('登入後可在不同裝置同步學習進度', 'Sign in to sync progress across devices');
    }
    if (p && !p.hidden) {
      p.innerHTML = panelHTML();
      const i = document.getElementById('cpIn'), o = document.getElementById('cpOut');
      if (i) i.onclick = signIn;
      if (o) o.onclick = () => auth.signOut();
    }
    const h = document.getElementById('syncHint'); if (h) h.outerHTML = hint();
  }
  function signIn() {
    err = ''; if (!ready) return;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') { err = T('登入失敗：', 'Sign-in failed: ') + e.code; toggle(true); }
    });
  }
  function toggle(show) {
    const p = document.getElementById('cloudPanel'), b = document.getElementById('cloudBtn'); if (!p) return;
    p.hidden = show === undefined ? !p.hidden : !show; b.setAttribute('aria-expanded', String(!p.hidden)); render();
  }
  function push() {
    if (!user) return;
    clearTimeout(timer); busy = true; render();
    timer = setTimeout(() => Promise.all(COURSE.tracks.map(t => ref(t.doc).set({ done: t.get(), lang: lang(), updated: Date.now() })))
      .then(() => { busy = false; err = ''; last = Date.now(); render(); })
      .catch(e => { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }), 800);
  }
  async function pull() {
    try {
      busy = true; render();
      let added = 0, ahead = false;
      for (const t of COURSE.tracks) {
        const snap = await ref(t.doc).get(), remote = (snap.exists && snap.data().done) || {}, local = { ...t.get() };
        const add = Object.keys(remote).filter(k => !local[k]);
        add.forEach(k => { local[k] = 1; });
        if (add.length) { t.set(local); added += add.length; }
        if (Object.keys(local).some(k => !remote[k])) ahead = true;
      }
      if (added) COURSE.refresh();
      busy = false; last = Date.now(); err = '';
      if (ahead) push(); else render();
    } catch (e) { busy = false; err = T('同步失敗：', 'Sync failed: ') + e.code; render(); }
  }
  // 首頁提示：有進度、還沒登入、沒按過「不用了」時才出現
  function hint() {
    if (!on() || user || !ready || !nDone() || store.get('syncHintOff', 0)) return '<div id="syncHint" hidden></div>';
    return `<div id="syncHint" class="sync-hint" data-notr><span>☁ ${T(`你已完成 ${nDone()} 章，進度目前只存在這台裝置。登入 Google 帳號，換手機或電腦也能接著學。`, `You've finished ${nDone()} chapters, saved on this device only. Sign in with Google to continue on your phone or another computer.`)}</span><button class="btn sm pri" type="button" data-sync="in">${T('登入同步', 'Sign in')}</button><button class="btn sm" type="button" data-sync="off">${T('不用了', 'No thanks')}</button></div>`;
  }
  async function start() {
    if (!on()) return;
    const top = document.querySelector('.top-in');
    if (!top) return;
    top.insertAdjacentHTML('beforeend', '<div class="cloud" data-notr><button class="btn cloud-btn" type="button" id="cloudBtn" aria-expanded="false" aria-controls="cloudPanel"></button><div class="cloud-panel" id="cloudPanel" role="dialog" hidden></div></div>');
    document.getElementById('cloudBtn').onclick = e => { e.stopPropagation(); toggle(); };
    document.addEventListener('click', e => {
      if (!e.target.closest('.cloud')) toggle(false);
      const s = e.target.closest('[data-sync]');
      if (s) { if (s.dataset.sync === 'in') signIn(); else { store.set('syncHintOff', 1); render(); } }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(false); });
    render();
    try {
      await load(SDK + 'app-compat.js');
      await Promise.all([load(SDK + 'auth-compat.js'), load(SDK + 'firestore-compat.js')]);
    } catch (e) { document.querySelector('.cloud').remove(); return; }
    firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.onAuthStateChanged(u => { user = u; ready = true; err = ''; render(); if (u) pull(); });
  }
  return { start, push, hint, render };
})();


/* ---------- 後中化學：啟動、雲端同步、PWA ---------- */
boot();
store.set('total', CH.length);  // 給學習階梯首頁顯示進度
const COURSE = {
  tracks: [{ doc: 'chemLadder', get: () => state.done, set: m => { state.done = m; store.set('done', m); } }],
  count: () => CH.filter(c => state.done[c.id]).length, total: () => CH.length,
  refresh: () => { updateProgress(); route(location.hash.slice(1)); },
};
if (document.querySelector('meta[name="app-site"]')) {
  document.querySelector('.brand').insertAdjacentHTML('beforebegin', '<a class="home-link" href="../">‹ 學習階梯</a>');
  if (typeof CLOUD !== 'undefined') CLOUD.start();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
}

</script>
