<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="學士後中醫入學考的普通化學與有機化學：用互動圖從原理學起，看懂酸鹼平衡與反應機構。">
<meta name="app-site" content="pages">
<meta name="theme-color" content="#17705F">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>後中化學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 學習階梯共用樣式：色票、字型、頁首、按鈕、同步面板（首頁與新課程共用；生統階梯 shell 內有自己的一份） */
:root {
  --bg: #F3F4F0; --surface: #FFFFFF; --sunk: #E9EBE5; --ink: #1A211F; --muted: #59635E; --line: #D5D9D1;
  --accent: #2F3B99; --accent-ink: #FFFFFF; --soft: #E6E8F5; --eosin: #B5326C; --eosin-soft: #F7E4EC;
  --good: #23704A; --good-soft: #E1F0E6; --warn: #8F5400; --warn-soft: #FAEFD9; --bad: #B0281F; --bad-soft: #FBE6E4;
  --c1: #3A47AE; --c2: #C0386F; --c3: #1C8270; --c4: #B07418;
  --display: "LXGW WenKai TC", "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101412; --surface: #171C1A; --sunk: #0C0F0E; --ink: #E3E8E5; --muted: #98A39E; --line: #2A322F;
  --accent: #A2ACF7; --accent-ink: #12163A; --soft: #20254A; --eosin: #F08AB6; --eosin-soft: #3A1B29;
  --good: #71CB95; --good-soft: #14301F; --warn: #E8AE55; --warn-soft: #33260F; --bad: #F28B82; --bad-soft: #3A1A18;
  --c1: #8E9BFA; --c2: #F07DB0; --c3: #5CCDB6; --c4: #E2AE5A; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.75; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; }
.mono { font-family: var(--mono); }
.small { font-size: 13px; } .mut { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--eosin); margin: 0 0 6px; }
.lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: block; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .04em; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14.5px; text-align: left; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.pri:hover { filter: brightness(1.08); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.wide { width: 100%; justify-content: center; margin-top: 12px; padding: 11px; }
.btn, .opt, .an, .tab { min-height: 44px; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; }
.lang select { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.cloud { position: relative; }
.cloud-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.cb-av, .cp-av { width: 20px; height: 20px; border-radius: 50%; }
.cb-dot { width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B; }
.cloud-panel { position: absolute; right: 0; top: calc(100% + 8px); width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 14px 16px; z-index: 40; font-size: 13.5px; line-height: 1.6; }
.cloud-panel p { margin: 0 0 10px; }
.cp-t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.cp-t small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.cp-av { width: 32px; height: 32px; }
.cp-st { background: var(--sunk); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; }
.cp-st.ok { color: #1F7A45; }
.cp-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 10px; }
.cp-go svg { background: #fff; border-radius: 3px; padding: 1px; }
.cp-s { font-size: 12px; color: var(--muted); margin: 0 !important; }
.cp-err { color: var(--eosin); font-size: 12px; margin-top: 8px !important; }
.sync-hint { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; background: var(--soft); font-size: 13.5px; }
.sync-hint span { flex: 1 1 260px; }
.home-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-right: -8px; }
.home-link:hover { color: var(--accent); }

/* 後中化學：沿用學習階梯色票，主色改為實驗室的青綠；化學圖用自己的一組顏色 */
:root { --accent: #17705F; --soft: #E1F1EC; --water: #DCEBF3; --acid: #3A5FB8; --base: #D2691E; --arrow: #C0386F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #5CCDB6; --accent-ink: #0B231E; --soft: #15302A; --water: #1C2B33; --acid: #8EA9F2; --base: #F0A060; --arrow: #F07DB0; } }
:root[data-theme="dark"] { --accent: #5CCDB6; --accent-ink: #0B231E; --soft: #15302A; --water: #1C2B33; --acid: #8EA9F2; --base: #F0A060; --arrow: #F07DB0; }
body { margin: 0; }
.top-in .prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prog .bar { width: 90px; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.toc-btn { display: none; }
.layout { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; }
#tocBox { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; padding: 18px 0 40px; font-size: 14px; }
.toc-h { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
#toc ol { list-style: none; margin: 0; padding: 0; }
#toc a, #toc .soon { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; }
#toc a:hover { background: var(--soft); }
#toc a.cur { background: var(--accent); color: var(--accent-ink); }
#toc a.done .num::after { content: " ✓"; color: var(--good); }
#toc .soon { color: var(--muted); opacity: .7; }
#toc .soon small { margin-left: auto; font-size: 11px; }
#toc .num { font-family: var(--mono); font-size: 11.5px; min-width: 30px; color: var(--muted); }
#toc a.cur .num { color: inherit; }
#article { max-width: 820px; padding: 24px 0 80px; min-width: 0; }
#article h1 { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); margin: 0 0 12px; }
.hero { font-size: clamp(30px, 6vw, 46px) !important; }
.lede { font-size: 17px; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 8px; }
.cta .btn { text-decoration: none; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 30px; }
.map h3 { font-size: 15px; margin: 6px 0; }
.map ol { margin: 0; padding-left: 22px; font-size: 14.5px; color: var(--muted); }
.map li.ok { color: var(--ink); font-weight: 500; }
.okm { color: var(--good); }
.how li { margin-bottom: 6px; }
.secnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 8px; }
.secnav a { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; text-decoration: none; color: var(--ink); background: var(--surface); }
.secnav a:hover { border-color: var(--accent); color: var(--accent); }
.sec { padding-top: 26px; scroll-margin-top: 70px; }
.sec h2 { font-family: var(--display); font-size: 25px; display: flex; gap: 12px; align-items: baseline; margin: 10px 0 8px; }
.sn { font-family: var(--mono); font-size: 14px; color: var(--accent-ink); background: var(--accent); border-radius: 50%; width: 28px; height: 28px; display: inline-grid; place-items: center; flex: none; transform: translateY(-3px); }
.prose p, .prose li { max-width: 72ch; }
.eq { font-family: var(--mono); font-size: 14.5px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 8px 14px; border-radius: 6px; overflow-x: auto; white-space: nowrap; }
.tbl { border-collapse: collapse; font-size: 14px; margin: 8px 0 12px; width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.tbl th { background: var(--sunk); }
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 16px 0; transition: box-shadow .3s; }
.widget.flash { box-shadow: 0 0 0 3px var(--accent); }
.w-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.w-row .sp { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rng { display: flex; align-items: center; gap: 10px; font-size: 14px; flex: 1 1 280px; }
.rng input { flex: 1; accent-color: var(--accent); }
.rng output { min-width: 72px; text-align: right; }
.sel select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; font-size: 13.5px; max-width: 100%; }
.sel { font-size: 13.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chk { display: inline-flex; gap: 6px; align-items: center; margin: 4px 0 10px; font-size: 14px; }
.btn.ghost { background: none; }
.cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--bg); min-width: 96px; }
.card span { display: block; font-size: 12px; color: var(--muted); }
.card b { font-family: var(--mono); font-size: 18px; }
.card small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.note { background: var(--soft); border-radius: 8px; padding: 10px 14px; font-size: 14.5px; margin: 10px 0 0; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -2px; }
.ok { color: var(--good); font-weight: 700; } .warn { color: var(--warn); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
/* 座標圖 */
svg.ch, svg.mol, svg.en, svg.bk, svg.ions { width: 100%; height: auto; display: block; overflow: visible; }
.ch .grid line { stroke: var(--line); stroke-width: 1; }
.ch .ax, .en .ax { stroke: var(--muted); stroke-width: 1.2; }
.tk { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
.tk.hl { fill: var(--ink); font-weight: 700; }
.lab { font-size: 12.5px; fill: var(--muted); }
.tline { fill: none; stroke: var(--acid); stroke-width: 2.6; }
.tline2 { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .7; }
.dot { fill: var(--arrow); stroke: var(--surface); stroke-width: 2; }
.dot2 { fill: var(--muted); stroke: var(--surface); stroke-width: 2; }
.dot3 { fill: var(--surface); stroke: var(--acid); stroke-width: 2; }
.mk { stroke: var(--muted); stroke-dasharray: 3 3; }
.cur { stroke: var(--arrow); stroke-width: 1.5; }
.buf { fill: var(--accent); opacity: .08; }
.indband { opacity: .28; }
.sha { fill: none; stroke: var(--acid); stroke-width: 2.6; } .sa { fill: none; stroke: var(--base); stroke-width: 2.6; }
.lha { fill: var(--acid); font-weight: 700; } .la { fill: var(--base); font-weight: 700; }
/* 燒杯 */
.tgrid { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 16px; align-items: center; }
.glass { fill: none; stroke: var(--muted); stroke-width: 2.5; }
.liq { transition: fill .3s; }
.burette { stroke: var(--muted); stroke-width: 6; stroke-linecap: round; }
.drop { fill: var(--acid); opacity: .7; }
.bk text { font-family: var(--mono); font-size: 8.5px; font-weight: 600; }
.iha circle { fill: var(--acid); } .iha text { fill: #fff; }
.ia circle { fill: var(--base); } .ia text { fill: #fff; }
.ih circle { fill: #B0281F; } .ih text { fill: #fff; }
.ioh circle { fill: #6B4FA0; } .ioh text { fill: #fff; font-size: 7px; }
.bk .phm { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
.bk .phv { font-family: var(--mono); font-size: 20px; font-weight: 700; fill: var(--ink); }
/* 緩衝 */
.bgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: center; }
.bars > div { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.bars > div.on { font-weight: 700; }
.bars i { display: block; height: 14px; border-radius: 3px; min-width: 2px; }
.bha { background: var(--acid); } .ba { background: var(--base); }
.stack { display: flex; height: 28px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
.stack i { display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12.5px; font-family: var(--mono); }
/* 計算 */
.calc { background: var(--bg); border-radius: 8px; padding: 10px 14px; }
.cq { margin: 6px 0; }
.cs { font-family: var(--mono); font-size: 13.5px; margin: 4px 0; }
.cs li { margin: 3px 0; }
/* 分子 */
.mol .b { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.mol .bw { fill: var(--ink); }
.mol .bh { stroke: var(--ink); stroke-width: 1.6; }
.mol .bp { stroke: var(--ink); stroke-width: 2.2; stroke-dasharray: 4 4; }
.mol .at { font-size: 16px; font-weight: 600; fill: var(--ink); }
.mol .at.hl { fill: var(--bad); }
.mol .at.br { fill: var(--base); }
.mol .lp { fill: var(--ink); }
.mol .chg { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.mol .chgt { font-size: 12px; font-weight: 700; fill: var(--ink); }
.mol .dl { font-size: 12px; fill: var(--muted); }
.mol .arr { fill: none; stroke: var(--arrow); stroke-width: 2.2; }
.mol .ahp { fill: var(--arrow); }
.mol .halo { fill: var(--acid); opacity: .1; }
.mol .orb { fill: var(--acid); fill-opacity: .1; stroke: var(--acid); stroke-dasharray: 4 3; }
.mol .ts { font-size: 120px; font-weight: 200; fill: var(--muted); }
.mol .tsd { font-size: 22px; fill: var(--muted); }
.mol .note { font-size: 14px; fill: var(--muted); }
.mol .note.bad { font-size: 30px; fill: var(--bad); font-weight: 700; }
.mol .nb { stroke: var(--ink); stroke-width: 2.2; }
.mol .nc { fill: var(--surface); stroke: var(--ink); stroke-width: 2.2; }
.mech { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.mech-cap { font-size: 14.5px; margin: 8px 0 0; }
.mech-ctl { margin-top: 10px; }
.en .ecurve { fill: none; stroke: var(--acid); stroke-width: 2.4; }
.en .edot { fill: var(--arrow); stroke: var(--surface); stroke-width: 2; }
.en .elab { font-size: 11px; fill: var(--muted); }
.lgrid, .zgrid, .ngrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-items: center; }
.ionc { fill: var(--sunk); stroke: var(--muted); } .ionc.on { fill: var(--base); fill-opacity: .25; stroke: var(--base); stroke-width: 2; }
.prod { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
.pf { font-family: var(--mono); font-size: 16px; font-weight: 600; margin: 0 0 2px; }
.prod p { margin: 0 0 4px; }
.prod .bars > div { grid-template-columns: 44px 1fr; }
.verdict { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; background: var(--soft); border-radius: 8px; padding: 10px 14px; margin-top: 6px; }
.verdict .lbl { margin: 0; }
.verdict .big { font-size: 26px; font-family: var(--mono); color: var(--accent); }
.reason li { margin: 6px 0; font-size: 14.5px; }
/* 立體化學 */
.mirror { display: grid; grid-template-columns: minmax(0, 1fr) 2px minmax(0, 1fr); gap: 10px; align-items: center; }
.mline { align-self: stretch; background: repeating-linear-gradient(var(--muted) 0 6px, transparent 6px 12px); }
.c { text-align: center; margin: 0; }
.mirror svg { max-height: 220px; }
#chairV svg, .ngrid svg { max-height: 260px; }
.rsgrid { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 14px; align-items: start; }
.rsteps li { margin: 6px 0; font-size: 14.5px; }
.mol .note.pri { font-family: var(--mono); font-size: 13px; fill: var(--accent); font-weight: 700; }
.fgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.fgrid .lbl, .fgrid .small { width: 100%; }
.fcell { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: grid; font-size: 13.5px; }
.fcell.on { border-color: var(--accent); background: var(--soft); }
.fcell b { font-family: var(--mono); }
.clash { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 3 3; }
.ice td:first-child { font-weight: 600; white-space: nowrap; }
@media (max-width: 600px) { .rsgrid { grid-template-columns: minmax(0, 1fr); } }
/* 動力學、酸鹼 */
.og { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.og > div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.og .og-on { border-color: var(--accent); background: var(--soft); }
.area { fill: var(--arrow); opacity: .25; }
.en .catc { fill: none; stroke: var(--good); stroke-width: 2.4; stroke-dasharray: 6 4; }
.bars.pk > div { grid-template-columns: minmax(110px, 160px) 1fr auto; }
.bars [role=button] { cursor: pointer; border-radius: 4px; }

/* 練習題 */

.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }

.foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 30px; padding-top: 20px; }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }

  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }

  .mech { grid-template-columns: minmax(0, 1fr); }
  .tgrid { grid-template-columns: minmax(0, 1fr); }
  .tgrid .beaker { max-width: 240px; margin: 0 auto; width: 100%; }
  .prog .bar { width: 50px; }
  .brand small { display: none; }
}

<body>


<header class="top"><div class="top-in">
  <a class="brand" href="#" style="text-decoration:none">後中化學<small>CHEMISTRY · 原理 → 應用</small></a>
  <button class="btn sm toc-btn" type="button" id="tocBtn">☰ 單元</button>
  <div class="prog" aria-label="學習進度"><span id="progTxt">0 / 2 章</span><span class="bar"><i id="progBar"></i></span></div>
</div></header>
<div class="layout">
  <aside id="tocBox" aria-label="單元目錄"><nav id="toc"></nav></aside>
  <main id="article"></main>
</div>
<script>
/* ---------- 後中化學：介面小工具（選取、跳脫、儲存、數字格式、座標圖） ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('chem-ladder:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('chem-ladder:' + k, JSON.stringify(v)); } catch (e) { /* 無法儲存時忽略 */ } },
};
// 數字：固定小數位；科學記號用 ×10 上標
const fx = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : '—');
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function sci(v, d = 2) {
  if (!Number.isFinite(v) || v === 0) return String(v);
  const e = Math.floor(Math.log10(Math.abs(v))), m = v / 10 ** e;
  if (e >= -2 && e <= 3) return v.toFixed(Math.max(0, d - e));
  return `${m.toFixed(d)} × 10${String(e).split('').map(c => SUP[c]).join('')}`;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* 座標圖：o = { w, h, x:[min,max], y:[min,max], xt:[刻度], yt:[刻度], xlab, ylab }；draw(X, Y) 回傳圖內 SVG */
function chart(o, draw) {
  const w = o.w || 560, h = o.h || 300, L = 46, R = 14, T = 12, B = 40;
  const X = v => L + (v - o.x[0]) / (o.x[1] - o.x[0]) * (w - L - R), Y = v => h - B - (v - o.y[0]) / (o.y[1] - o.y[0]) * (h - T - B);
  const xt = o.xt || [], yt = o.yt || [];
  return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img"${o.label ? ` aria-label="${esc(o.label)}"` : ''}>
<g class="grid">${yt.map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>
<line class="ax" x1="${L}" x2="${w - R}" y1="${h - B}" y2="${h - B}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${h - B}"/>
${xt.map(v => `<text class="tk" x="${X(v)}" y="${h - B + 16}" text-anchor="middle">${v}</text>`).join('')}
${yt.map(v => `<text class="tk" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
${o.xlab ? `<text class="lab" x="${(L + w - R) / 2}" y="${h - 6}" text-anchor="middle">${o.xlab}</text>` : ''}
${o.ylab ? `<text class="lab" transform="translate(13 ${(T + h - B) / 2}) rotate(-90)" text-anchor="middle">${o.ylab}</text>` : ''}
${draw(X, Y)}</svg>`;
}
const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');

/* ---------- 後中化學：酸鹼平衡計算引擎 ----------
   不用近似：直接解電荷平衡 [H⁺] + [Na⁺] = [OH⁻] + [A⁻] + [Cl⁻]，其中 [A⁻] = C·Ka/(Ka + [H⁺])（強酸則 [A⁻] = C）。
   左邊減右邊隨 [H⁺] 單調遞增，所以在 log[H⁺] 上二分法一定收斂。濃度 M、體積 mL、量 mmol。 */
const KW = 1e-14;
function solveH({ Ca = 0, Ka = 1e-5, strong = false, Na = 0, Cl = 0 }) {
  const f = h => h + Na - KW / h - (strong ? Ca : Ca * Ka / (Ka + h)) - Cl;
  let lo = -15, hi = 1.5;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (f(10 ** m) > 0) hi = m; else lo = m; }
  return 10 ** ((lo + hi) / 2);
}
const ACID = {
  weak: { name: '醋酸 CH₃COOH', short: 'HA', pKa: 4.74, strong: false },
  strong: { name: '鹽酸 HCl', short: 'HCl', pKa: -7, strong: true },
};
// 滴定：Va mL 的 Ca0 M 酸，加入 Vb mL 的 Cb M NaOH
function titr({ Va = 25, Ca0 = 0.1, Cb = 0.1, Vb = 0, pKa = 4.74, strong = false }) {
  const V = Va + Vb, Ca = Ca0 * Va / V, Na = Cb * Vb / V, Ka = 10 ** -pKa, h = solveH({ Ca, Ka, strong, Na });
  const fHA = strong ? 0 : h / (Ka + h);
  return { V, h, pH: -Math.log10(h), nHA: Ca * V * fHA, nA: Ca * V * (1 - fHA), nOH: KW / h * V, nH: h * V, nNa: Cb * Vb, Veq: Ca0 * Va / Cb };
}
// 緩衝溶液：V mL 中各含 C M 的 HA 與 NaA，再加入 addH mmol 強酸或 addOH mmol 強鹼（以濃溶液加入，體積變化忽略）
function buffer({ C = 0.1, V = 100, pKa = 4.74, addH = 0, addOH = 0 }) {
  const Ka = 10 ** -pKa, h = solveH({ Ca: 2 * C, Ka, Na: (C * V + addOH) / V, Cl: addH / V }), f = h / (Ka + h);
  return { pH: -Math.log10(h), nHA: 2 * C * V * f, nA: 2 * C * V * (1 - f) };
}
function water({ V = 100, addH = 0, addOH = 0 }) { const h = solveH({ Ca: 0, Na: addOH / V, Cl: addH / V }); return { pH: -Math.log10(h) }; }
// 指示劑：變色範圍與兩端顏色（低 pH → 高 pH）
const IND = {
  none: { name: '不加指示劑' },
  pp: { name: '酚酞', lo: 8.2, hi: 10.0, c0: [248, 246, 240], c1: [214, 51, 132], txt: '無色 → 粉紅' },
  mo: { name: '甲基橙', lo: 3.1, hi: 4.4, c0: [214, 60, 50], c1: [240, 196, 60], txt: '紅 → 黃' },
  btb: { name: '溴瑞香草酚藍', lo: 6.0, hi: 7.6, c0: [226, 200, 60], c1: [52, 104, 196], txt: '黃 → 藍' },
};
function indColor(key, pH) {
  const d = IND[key]; if (!d || !d.c0) return 'var(--water)';
  const t = clamp((pH - d.lo) / (d.hi - d.lo), 0, 1), c = d.c0.map((v, i) => Math.round(v + (d.c1[i] - v) * t));
  return `rgb(${c.join(',')})`;
}

/* ---------- 後中化學：分子與反應機構繪圖 ----------
   場景（scene）：
     atoms: { id: { x, y, t: 標籤（'' 為骨架頂點）, c: 電荷（'+' '−' 'δ+' 'δ−'）, lp: [孤對電子方向（度）], halo: 立體障礙半徑, hl: 強調色, hide } }
     bonds: [[a, b, 型別]]  型別：'s' 單鍵、'd' 雙鍵、't' 參鍵、'w' 楔形（朝向讀者）、'h' 虛楔（遠離讀者）、'p' 部分鍵（過渡狀態）、'sd' 實線＋虛線（共振混成）
     rings: [{ x, y, r }]  環內圈（苯的共振混成）
     arrows: [{ f: { lp: [原子, 角度] } | { b: [a, b] }, t: { a: 原子 } | { m: [a, b] }, bend }]  彎箭頭：電子從哪裡流到哪裡
     orbs: [{ a: 原子, ang }]  空的 p 軌域（兩瓣）；ts: true 畫過渡狀態的括號；notes: [{ x, y, t, cls }]
   座標以鍵長為 1，y 朝上；MOL.svg(scene, { w, h, s: 每單位像素, cx, cy }) 畫出 SVG。 */
const MOL = (() => {
  const vis = t => (t || '').replace(/[₀-₉⁰-⁹⁺⁻]/g, '').length;   // 標籤可見字數（下標不太佔寬）
  const rad = a => (a.t ? 7 + 4.2 * vis(a.t) : 0);
  function geom(sc, o) {
    const S = o.s || 46, cx = o.cx ?? o.w / 2, cy = o.cy ?? o.h / 2;
    const P = id => { const a = sc.atoms[id]; return [cx + a.x * S, cy - a.y * S]; };
    return { S, P };
  }
  function bond(sc, G, [a, b, k]) {
    const A = sc.atoms[a], B = sc.atoms[b]; if (!A || !B || A.hide || B.hide) return '';
    let [x1, y1] = G.P(a), [x2, y2] = G.P(b); const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const r1 = Math.min(rad(A), L * 0.4), r2 = Math.min(rad(B), L * 0.4);
    x1 += ux * r1; y1 += uy * r1; x2 -= ux * r2; y2 -= uy * r2;
    const nx = -uy, ny = ux;
    if (k === 'w') return `<path class="bw" d="M${x1} ${y1}L${x2 + nx * 5} ${y2 + ny * 5}L${x2 - nx * 5} ${y2 - ny * 5}Z"/>`;
    if (k === 'h') return Array.from({ length: 6 }, (_, i) => { const t = (i + 0.5) / 6, w = 0.8 + 4.5 * t, px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t; return `<line class="bh" x1="${px + nx * w}" y1="${py + ny * w}" x2="${px - nx * w}" y2="${py - ny * w}"/>`; }).join('');
    if (k === 'p') return `<line class="bp" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (k === 'sd') return `<line class="b" x1="${x1 + nx * 3}" y1="${y1 + ny * 3}" x2="${x2 + nx * 3}" y2="${y2 + ny * 3}"/><line class="bp" x1="${x1 - nx * 3}" y1="${y1 - ny * 3}" x2="${x2 - nx * 3}" y2="${y2 - ny * 3}"/>`;
    if (k === 't') return `<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="b" x1="${x1 + nx * 4}" y1="${y1 + ny * 4}" x2="${x2 + nx * 4}" y2="${y2 + ny * 4}"/><line class="b" x1="${x1 - nx * 4}" y1="${y1 - ny * 4}" x2="${x2 - nx * 4}" y2="${y2 - ny * 4}"/>`;
    if (k === 'd') return `<line class="b" x1="${x1 + nx * 3}" y1="${y1 + ny * 3}" x2="${x2 + nx * 3}" y2="${y2 + ny * 3}"/><line class="b" x1="${x1 - nx * 3}" y1="${y1 - ny * 3}" x2="${x2 - nx * 3}" y2="${y2 - ny * 3}"/>`;
    return `<line class="b" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }
  function atom(sc, G, id) {
    const a = sc.atoms[id]; if (a.hide) return '';
    const [x, y] = G.P(id), r = rad(a);
    let s = '';
    if (a.halo) s += `<circle class="halo" cx="${x}" cy="${y}" r="${a.halo * G.S}"/>`;
    if (a.t) s += `<text class="at${a.hl ? ' hl' : ''}" x="${x}" y="${y + 5.5}" text-anchor="middle">${a.t}</text>`;
    (a.lp || []).forEach(g => {
      const u = [Math.cos(g * Math.PI / 180), -Math.sin(g * Math.PI / 180)], d = Math.max(r, 6) + 5, px = x + u[0] * d, py = y + u[1] * d;
      s += `<circle class="lp" cx="${px - u[1] * 3}" cy="${py + u[0] * 3}" r="1.9"/><circle class="lp" cx="${px + u[1] * 3}" cy="${py - u[0] * 3}" r="1.9"/>`;
    });
    if (a.c) { const cxx = x + Math.max(r, 6) + 2, cyy = y - 10; s += a.c.startsWith('δ') ? `<text class="dl" x="${cxx}" y="${cyy}">${a.c}</text>` : `<circle class="chg" cx="${cxx + 4}" cy="${cyy - 3}" r="7"/><text class="chgt" x="${cxx + 4}" y="${cyy + 1}" text-anchor="middle">${a.c === '+' ? '+' : '−'}</text>`; }
    return s;
  }
  function arrow(sc, G, ar) {
    let s, e;
    if (ar.f.lp) { const [id, g] = ar.f.lp, [x, y] = G.P(id), r = Math.max(rad(sc.atoms[id]), 6) + 5; s = [x + Math.cos(g * Math.PI / 180) * r, y - Math.sin(g * Math.PI / 180) * r]; }
    else { const [p, q] = ar.f.b.map(G.P); s = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    if (ar.t.a) { const [x, y] = G.P(ar.t.a), r = Math.max(rad(sc.atoms[ar.t.a]), 7) + 3, d = Math.hypot(x - s[0], y - s[1]) || 1; e = [x - (x - s[0]) / d * r, y - (y - s[1]) / d * r]; }
    else { const [p, q] = ar.t.m.map(G.P); e = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    const mx = (s[0] + e[0]) / 2, my = (s[1] + e[1]) / 2, L = Math.hypot(e[0] - s[0], e[1] - s[1]), b = ar.bend ?? 0.45;
    const c = [mx - (e[1] - s[1]) / L * L * b, my + (e[0] - s[0]) / L * L * b];
    return `<path class="arr" d="M${s[0].toFixed(1)} ${s[1].toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${e[0].toFixed(1)} ${e[1].toFixed(1)}" marker-end="url(#ah)"/>`;
  }
  function orb(sc, G, o) {
    const [x, y] = G.P(o.a), g = (o.ang || 0), r = G.S * 0.62;
    return [0, 180].map(k => { const t = (g + k) * Math.PI / 180; return `<ellipse class="orb" cx="${x + Math.cos(t) * r}" cy="${y - Math.sin(t) * r}" rx="${r * 0.82}" ry="${r * 0.42}" transform="rotate(${-(g + k)} ${x + Math.cos(t) * r} ${y - Math.sin(t) * r})"/>`; }).join('');
  }
  function svg(sc, o) {
    const G = geom(sc, o), ids = Object.keys(sc.atoms);
    let body = (sc.orbs || []).map(x => orb(sc, G, x)).join('');
    body += ids.filter(i => sc.atoms[i].halo && !sc.atoms[i].hide).map(i => { const [x, y] = G.P(i); return `<circle class="halo" cx="${x}" cy="${y}" r="${sc.atoms[i].halo * G.S}"/>`; }).join('');
    body += (sc.bonds || []).map(b => bond(sc, G, b)).join('');
    body += (sc.rings || []).map(r => `<circle class="bp" fill="none" cx="${(o.cx ?? o.w / 2) + r.x * G.S}" cy="${(o.cy ?? o.h / 2) - r.y * G.S}" r="${r.r * G.S}"/>`).join('');
    body += ids.map(i => atom(sc, G, i).replace(/<circle class="halo"[^>]*\/>/, '')).join('');
    body += (sc.arrows || []).map(a => arrow(sc, G, a)).join('');
    if (sc.ts) body += `<text class="ts" x="${o.w / 2 - G.S * 3.1}" y="${o.h / 2 + 14}">[</text><text class="ts" x="${o.w / 2 + G.S * 2.85}" y="${o.h / 2 + 14}">]</text><text class="tsd" x="${o.w / 2 + G.S * 3.15}" y="${o.h / 2 - 26}">‡</text>`;
    body += (sc.notes || []).map(n => { const x = (o.cx ?? o.w / 2) + n.x * G.S, y = (o.cy ?? o.h / 2) - n.y * G.S; return `<text class="note ${n.cls || ''}" x="${x}" y="${y}" text-anchor="middle">${n.t}</text>`; }).join('');
    return `<svg class="mol" viewBox="0 0 ${o.w} ${o.h}" role="img"${o.label ? ` aria-label="${esc(o.label)}"` : ''}><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahp"/></marker></defs>${body}</svg>`;
  }
  // 兩個場景之間的插值：位置線性內插；前半段用起點的鍵，後半段用終點的鍵；動畫中不畫箭頭
  function lerp(a, b, t) {
    const atoms = {};
    for (const id of new Set([...Object.keys(a.atoms), ...Object.keys(b.atoms)])) {
      const p = a.atoms[id], q = b.atoms[id];
      if (p && q) atoms[id] = { ...(t < 0.5 ? p : q), x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t, hide: (t < 0.5 ? p : q).hide };
      else atoms[id] = { ...(p || q), hide: (p ? t > 0.5 : t < 0.5) || (p || q).hide };
    }
    const src = t < 0.5 ? a : b;
    return { atoms, bonds: src.bonds, orbs: src.orbs, notes: [] };
  }
  return { svg, lerp };
})();

/* 反應能量圖：pts 為 [x, y] 的控制點（x 0–1、y 0–1），以平滑曲線連起來；at 為目前位置 */
function energySVG(pts, at, o = {}) {
  const w = o.w || 300, h = o.h || 150, L = 26, B = 22, T = 10, R = 8;
  const X = v => L + v * (w - L - R), Y = v => h - B - v * (h - T - B);
  const mk = P => x => { // 分段餘弦內插：極大極小點都平滑
    for (let i = 0; i < P.length - 1; i++) { const [x0, y0] = P[i], [x1, y1] = P[i + 1]; if (x <= x1) { const t = (x - x0) / (x1 - x0); return y0 + (y1 - y0) * (1 - Math.cos(Math.PI * t)) / 2; } }
    return P[P.length - 1][1];
  };
  const f = mk(pts), alt = o.alt ? `<path class="catc" d="${path(Array.from({ length: 121 }, (_, i) => [X(i / 120), Y(mk(o.alt)(i / 120))]))}"/>` : '';
  const line = Array.from({ length: 121 }, (_, i) => [X(i / 120), Y(f(i / 120))]);
  const cur = at == null ? '' : `<circle class="edot" cx="${X(at)}" cy="${Y(f(at))}" r="6"/>`;
  const labs = (o.labels || []).map(([x, t, dy]) => `<text class="elab" x="${X(x) + (x < 0.1 ? 6 : 0)}" y="${Y(f(x)) - (dy || 10)}" text-anchor="${x < 0.1 ? 'start' : x > 0.9 ? 'end' : 'middle'}">${t}</text>`).join('');
  return `<svg class="en" viewBox="0 0 ${w} ${h}" role="img" aria-label="反應能量圖"><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${h - B}"/><line class="ax" x1="${L}" y1="${h - B}" x2="${w - R}" y2="${h - B}"/><text class="lab" transform="translate(12 ${(T + h - B) / 2}) rotate(-90)" text-anchor="middle">能量</text><text class="lab" x="${(L + w) / 2}" y="${h - 5}" text-anchor="middle">反應進行 →</text><path class="ecurve" d="${path(line)}"/>${alt}${labs}${cur}</svg>`;
}

/* 機構播放器：frames = [{ sc, cap, at }]；在 el 中畫出分子、說明、能量圖與控制鈕。回傳 { go(i), reset() } */
function mechPlayer(el, o) {
  let frames = o.frames(), i = 0, anim = 0;
  el.innerHTML = `<div class="mech"><div class="mech-view"></div><div class="mech-side">${o.energy ? '<div class="mech-en"></div>' : ''}<p class="mech-cap" aria-live="polite"></p></div></div>
<div class="w-row mech-ctl"><button class="btn sm" type="button" data-m="0">⟲ 重來</button><button class="btn sm" type="button" data-m="-1">‹ 上一步</button><button class="btn sm pri" type="button" data-m="1">下一步 ›</button><span class="mech-step mono small mut"></span></div>`;
  const view = $('.mech-view', el), cap = $('.mech-cap', el), en = $('.mech-en', el), step = $('.mech-step', el), W = o.w || 520, H = o.h || 260;
  const draw = (sc, f) => {
    view.innerHTML = MOL.svg(sc, { w: W, h: H, s: o.s || 56, label: o.label });
    if (f) { cap.innerHTML = f.cap; if (en) en.innerHTML = energySVG(o.energy, f.at, { labels: o.elabels }); step.textContent = `${i + 1} / ${frames.length}`; }
    $('[data-m="1"]', el).disabled = i >= frames.length - 1; $('[data-m="-1"]', el).disabled = i <= 0;
  };
  const show = () => draw(frames[i].sc, frames[i]);
  function go(n, animate = true) {
    n = clamp(n, 0, frames.length - 1); cancelAnimationFrame(anim);
    if (!animate || n !== i + 1 || matchMedia('(prefers-reduced-motion: reduce)').matches) { i = n; show(); return; }
    const a = frames[i].sc, b = frames[n].sc, t0 = performance.now(), D = 900;
    const tick = now => {
      const t = Math.min(1, (now - t0) / D), e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      view.innerHTML = MOL.svg(MOL.lerp(a, b, e), { w: W, h: H, s: o.s || 56 });
      if (en) en.innerHTML = energySVG(o.energy, frames[i].at + (frames[n].at - frames[i].at) * e, { labels: o.elabels });
      if (t < 1) anim = requestAnimationFrame(tick); else { i = n; show(); }
    };
    anim = requestAnimationFrame(tick);
  }
  $$('[data-m]', el).forEach(b => { b.onclick = () => { const m = +b.dataset.m; if (m === 0) go(0, false); else go(i + m, m > 0); }; });
  show();
  return { go, reset() { frames = o.frames(); i = Math.min(i, frames.length - 1); go(0, false); }, get i() { return i; } };
}

CH.push({
    id: 'sn-e', unit: 'o4', title: '取代與脫去：SN2、SN1、E2、E1',
    lede: '鹵烷遇到親核基或鹼，會走四條路之一。不用背表格：只要看懂「誰的電子去攻擊誰」和「有什麼擋在路上」，就能推出答案。',
    sections: [
      { h: '起點：碳–鹵鍵為什麼會被攻擊', w: 'leaving', body: `
<p>鹵素的電負度比碳大，C–X 鍵的電子偏向 X，碳帶部分正電（δ+）。帶負電或有孤對電子的分子（<b>親核基</b>，Nu:）就會被這個 δ+ 的碳吸引，用自己的電子對去和它成鍵。</p>
<p>但碳已經有四個鍵，新鍵要形成，就得有一個舊鍵斷掉：X 必須<b>帶著那一對電子離開</b>，變成 X⁻。離開後的 X⁻ 越穩定，它就越願意離開，我們說它是越好的<b>離去基</b>。</p>
<p>怎麼判斷 X⁻ 穩不穩定？用酸鹼章學過的關係：<b>酸越強，它的共軛鹼越穩定</b>。所以只要看 HX 的 pKa：</p>
<p class="eq">HI（−10）> HBr（−9）> HCl（−7）≫ HF（3.2）　⇒　離去能力 I⁻ > Br⁻ > Cl⁻ ≫ F⁻</p>
<p>同一個道理解釋了醇：直接離開的會是 OH⁻（H₂O 的 pKa 15.7，非常差的離去基），所以醇不會直接被取代；先加酸把 –OH 質子化成 –OH₂⁺，離開的就變成中性的 H₂O（H₃O⁺ 的 pKa −1.7），立刻成為好離去基。</p>` },
      { h: 'SN2：一步到位，從背面進攻', w: 'sn2', body: `
<p>親核基的孤對電子從 C–X 鍵的<b>正對面（背面）</b>進攻：這個方向正好對準 C–X 反鍵結軌域，也離帶負電的 X 最遠。新鍵形成和舊鍵斷裂<b>同時發生</b>，整個反應只有一個過渡狀態。</p>
<p>按「下一步」看動畫，注意兩件事：</p>
<ol><li>過渡狀態時，碳上另外三個基團被推到同一平面，像一把被風吹到翻過來一半的雨傘。</li>
<li>產物的三個基團翻到另一邊：<b>構型反轉</b>（華爾頓反轉）。(R)-2-溴丁烷經 SN2 生成 (S)-2-丁醇。</li></ol>
<p>因為過渡狀態同時包含鹵烷和親核基，速率和兩者都成正比：</p>
<p class="eq">rate = k [RX] [Nu⁻]　（二級反應，SN2 的「2」就是這個意思）</p>
<p>切換基質看看：碳上的基團越大，背面越擠，親核基越難靠近。甲基最快，一級次之，二級慢很多，<b>三級幾乎不反應</b>。極性非質子性溶劑（丙酮、DMSO、DMF）不會用氫鍵包住親核基，讓它更「赤裸」、更有攻擊力，所以有利 SN2。</p>` },
      { h: 'SN1：先斷鍵，再進攻', w: 'sn1', body: `
<p>三級鹵烷的背面被擋住，走不了 SN2，但它有另一條路：C–X 鍵<b>先自己斷開</b>，生成帶正電的<b>碳陽離子</b>；之後親核基（常常就是溶劑，例如水或醇）再很快地加上去。</p>
<p>第一步（斷鍵）最慢，而且只有鹵烷參與，所以速率只和鹵烷有關，和親核基的濃度、強弱都無關：</p>
<p class="eq">rate = k [RX]　（一級反應）</p>
<p>第一步快不快，取決於碳陽離子穩不穩定：<b>三級 > 二級 > 一級 > 甲基</b>。原因是相鄰的 C–H 鍵電子可以分攤正電荷（<b>超共軛</b>），三級碳旁邊有 9 個 C–H 能幫忙，甲基一個都沒有。極性質子性溶劑（水、醇）能用氫鍵和偶極包住生成的離子，降低第一步的能量，所以有利 SN1。</p>
<p>碳陽離子是<b>平面形</b>（sp²），空的 p 軌域上下兩瓣都能接受電子，親核基從左右兩面進攻的機會差不多。分別選「從左邊進攻」和「從右邊進攻」播放：一個得到構型反轉、一個得到構型保留，兩者是鏡像異構物，所以產物接近<b>外消旋</b>（常略多一點反轉產物，因為剛離開的 X⁻ 會暫時擋住同一側）。</p>` },
      { h: 'E2：鹼拿走 β-氫，一步形成雙鍵', w: ['e2', 'newman', 'zaitsev'], body: `
<p>如果進攻的是<b>強鹼</b>，它可以不碰碳，改拿走旁邊那個碳（β 碳）上的氫。三件事同時發生：</p>
<ol><li>鹼的孤對電子和 β-H 成鍵；</li><li>原本 C–H 鍵的電子轉過去形成 C=C 的 π 鍵；</li><li>X 帶著電子對離開。</li></ol>
<p>速率和鹵烷、鹼都有關：rate = k [RX] [B⁻]。</p>
<p>為了讓 C–H 的電子能順利「推」進 C–X 的反鍵結軌域，<b>H 和 X 必須在相反兩側、同一平面上</b>，稱為<b>反式共平面</b>（anti-periplanar）。下面第二個圖用紐曼投影式沿著 C–C 鍵看過去，轉動後面的碳，找出 E2 可以發生的角度。</p>
<p>如果不只一種 β-氫可以拿，通常得到<b>雙鍵上取代基較多</b>、較穩定的烯，這叫<b>查依采夫（Zaitsev）規則</b>。但體積很大的鹼（例如 t-BuO⁻）擠不進裡面，只能拿外側甲基上的氫，結果反而以取代較少的烯為主，稱為<b>霍夫曼（Hofmann）產物</b>。第三個圖可以切換兩種鹼比較。</p>` },
      { h: 'E1：和 SN1 共用第一步', w: 'e1', body: `
<p>E1 的第一步和 SN1 完全一樣：鹵烷先解離成碳陽離子。接下來碳陽離子有兩個選擇：</p>
<ul><li>被親核基加上去 → SN1；</li><li>被弱鹼（通常就是溶劑）拿走 β-氫，形成雙鍵 → E1。</li></ul>
<p>所以 SN1 和 E1 幾乎總是一起出現，速率都只和鹵烷有關（rate = k[RX]）。E1 沒有反式共平面的限制（碳陽離子是平面形，β-H 隨時都對得上空的 p 軌域），產物通常以較穩定、取代較多的烯為主。</p>
<p><b>加熱會偏向脫去</b>：脫去反應把一個分子變成三個（烯、H–B、X⁻），熵增加（ΔS > 0）。依 ΔG = ΔH − TΔS，溫度越高，−TΔS 越負，對脫去越有利。</p>` },
      { h: '把四條路放在一起：一步一步判斷', w: 'decide', body: `
<p>判斷時依序問三個問題，每個問題都對應前面看過的原因：</p>
<ol><li><b>基質是甲基、一級、二級還是三級？</b>決定背面擠不擠（SN2）、碳陽離子穩不穩（SN1／E1），以及有沒有 β-氫（甲基沒有，不能脫去）。</li>
<li><b>試劑是強鹼嗎？是好的親核基嗎？體積大嗎？</b>強鹼偏向 E2；強親核弱鹼（I⁻、Br⁻、RS⁻、N₃⁻、CN⁻）偏向 SN2；體積大的強鹼幾乎只做 E2；弱親核弱鹼（H₂O、ROH）只能等碳陽離子生成，走 SN1／E1。</li>
<li><b>溶劑和溫度？</b>極性非質子性溶劑幫 SN2；極性質子性溶劑幫 SN1／E1；加熱幫脫去。</li></ol>
<p>選好條件，看推理過程。試著自己先想答案，再對照。</p>` },

  lede: '分子式相同、原子連接方式也相同，只差在空間中的排列，性質卻可能天差地遠：一個是藥、一個沒有藥效甚至有毒。這一章看懂分子的「左右手」和「姿勢」，SN2 的構型反轉、E2 的反式共平面都建立在這裡。',
  sections: [
    { h: '左手和右手：掌性', w: 'chiral', body: `
<p>你的左手和右手互為鏡像，但不管怎麼轉都疊不起來。分子也一樣：如果一個分子和它的鏡像無法重疊，就稱為<b>掌性分子</b>（chiral），它和鏡像是一對<b>鏡像異構物</b>（enantiomers）。</p>
<p>最常見的原因是<b>掌性中心</b>：一個 sp³ 碳連著<b>四個不同</b>的基團。立體式的畫法：</p>
<ul><li>實線：在紙面上；<b>楔形</b>（實心三角形）：朝向你；<b>虛楔</b>（斜線）：遠離你。</li></ul>
<p>比較 2-丁醇（四個基團都不同）和 2-丙醇（有兩個 CH₃）。把鏡像轉過來疊到原分子上：2-丙醇疊得起來，因為它有一個穿過分子的鏡面；2-丁醇疊不起來。</p>
<p>鏡像異構物的熔點、沸點、溶解度完全相同，差別只在<b>使平面偏極光旋轉的方向相反</b>，以及和其他掌性分子（例如體內的酵素、受體）的作用不同。等量的一對鏡像異構物混合物稱為<b>外消旋</b>混合物，旋光互相抵消。</p>` },
    { h: 'R 和 S：給左右手取名字', w: 'rs', body: `
<p>用 Cahn–Ingold–Prelog（CIP）規則命名掌性中心，三個步驟：</p>
<ol><li><b>排優先順序</b>：看直接連在掌性中心上的原子，<b>原子序大的優先</b>。相同時往下一層，把各自連著的三個原子由大到小排好，從第一個開始比，第一個不同處決定勝負。雙鍵把相連的原子算兩次。</li>
<li><b>把最低優先（通常是 H）放到遠離你的位置</b>（虛楔）。</li>
<li>看 1 → 2 → 3 的方向：<b>順時針 = R</b>（rectus，右），<b>逆時針 = S</b>（sinister，左）。</li></ol>
<p>實用技巧：如果 H 在楔形（朝向你），直接看方向再把答案<b>反過來</b>；任意交換兩個基團，構型就反轉一次。</p>
<p>注意：R/S 只是命名，和旋光方向（+／−）沒有固定關係，必須用實驗量測。</p>` },
    { h: '兩個掌性中心：非鏡像異構物與內消旋', w: 'fischer', body: `
<p>有 n 個掌性中心，最多有 2ⁿ 個立體異構物。兩個中心時有四種組合：(R,R)、(S,S)、(R,S)、(S,R)。</p>
<ul><li>構型<b>全部相反</b>：鏡像異構物，例如 (R,R) 和 (S,S)。</li>
<li>只有<b>部分相反</b>：<b>非鏡像異構物</b>（diastereomers），例如 (R,R) 和 (R,S)。它們不是鏡像，物理性質不同，可以用一般方法分離。</li>
<li>如果分子兩半結構相同，(R,S) 可能和自己的鏡像相同：分子內有鏡面，稱為<b>內消旋</b>（meso）化合物，雖然有掌性中心卻沒有光學活性。</li></ul>
<p>這裡用<b>費雪投影式</b>表示：碳鏈直放，<b>橫線朝向你、直線遠離你</b>。費雪投影式只能在紙面上轉 180°，不能轉 90° 或翻面，否則構型會變。</p>
<p>切換酒石酸和 2-溴-3-氯丁烷，比較為什麼前者只有 3 個立體異構物、後者有 4 個。</p>` },
    { h: '構形：單鍵可以轉', w: 'butane', body: `
<p>C–C 單鍵可以自由旋轉，旋轉造成的不同空間排列稱為<b>構形</b>（conformation）。構形之間轉換很快，不能分離，這點和需要斷鍵才能互換的<b>構型</b>（configuration，如 R/S）不同。</p>
<p>用<b>紐曼投影式</b>沿著 C–C 鍵看過去：前面的碳是中心點，後面的碳是圓。</p>
<ul><li><b>交錯式</b>：前後的鍵錯開，能量低。</li><li><b>重疊式</b>：前後的鍵正對，電子互斥（扭轉張力），能量高。</li></ul>
<p>丁烷還要考慮兩個甲基的距離：<b>反式</b>（180°）最穩定；<b>間扭式</b>（60°）兩個甲基相鄰，高 3.8 kJ/mol；兩個甲基重疊時最高。上一章 E2 需要 H 和離去基「反式共平面」，指的就是這種 180° 的交錯構形。</p>` },
    { h: '環己烷的椅式：直立鍵與平伏鍵', w: 'chair', body: `
<p>環己烷不是平的，而是折成<b>椅式</b>：所有鍵角接近 109.5°，而且每個 C–C 鍵都是交錯式，沒有角張力也沒有扭轉張力。</p>
<p>每個碳有兩個位置：</p>
<ul><li><b>直立鍵</b>（axial）：和環的軸平行，上下交替。</li><li><b>平伏鍵</b>（equatorial）：大致沿著環的外圍向外伸。</li></ul>
<p>椅式可以<b>環翻轉</b>，翻轉後所有直立鍵變成平伏鍵、平伏鍵變成直立鍵。取代基在直立鍵時，會和同一側、隔一個碳的兩個直立 H 擠在一起（<b>1,3-雙直立作用</b>），所以大的取代基偏好<b>平伏鍵</b>。基團越大，偏好越明顯：第三丁基幾乎 100% 待在平伏鍵。</p>` },
  ],
  quiz: [
    { q: '下列哪一個分子有掌性中心？', o: ['2-丁醇 CH₃CH(OH)CH₂CH₃', '2-丙醇 CH₃CH(OH)CH₃', '乙醇 CH₃CH₂OH', '甘胺酸 H₂NCH₂COOH'], a: 0,
      why: '2-丁醇的 C2 連著 OH、H、CH₃、C₂H₅ 四個不同基團。其他分子的碳都有兩個以上相同的基團。', show: { w: 'chiral', set: { set: 'butanol', rot: true } } },
    { q: '依 CIP 規則，下列基團優先順序何者正確？', o: ['–OH > –CHO > –CH₂OH > –H', '–CHO > –OH > –CH₂OH > –H', '–CH₂OH > –CHO > –OH > –H', '–OH > –CH₂OH > –CHO > –H'], a: 0,
      why: '先比直接相連的原子：O > C > H。兩個 C 再往下一層：CHO 的碳連著 (O, O, H)（雙鍵 O 算兩次），CH₂OH 的碳連著 (O, H, H)，所以 CHO 優先。', show: { w: 'rs', set: { mol: 'gla', step: 1 } } },
    { q: '最低優先的 H 在楔形（朝向你）時，看到 1 → 2 → 3 是順時針，這個掌性中心是？', o: ['S', 'R', '無法判斷', '不是掌性中心'], a: 0,
      why: 'H 朝向你時，看到的方向和真正的方向相反：看起來順時針，實際是逆時針，所以是 S。', show: { w: 'rs', set: { mol: 'but', swap: 'wedge,dash', step: 3 } } },
    { q: '(2R,3R)-酒石酸和 (2R,3S)-酒石酸的關係是？', o: ['非鏡像異構物', '鏡像異構物', '同一個化合物', '構造異構物'], a: 0,
      why: '只有 C3 的構型相反，不是鏡像，所以是非鏡像異構物。(2R,3S) 本身是內消旋化合物。', show: { w: 'fischer', set: { mol: 'tart', sides: ['right', 'left'] } } },
    { q: '內消旋（meso）化合物的特徵是？', o: ['有掌性中心，但分子內有鏡面，沒有光學活性', '沒有掌性中心', '是一對鏡像異構物的等量混合物', '旋光度是鏡像異構物的兩倍'], a: 0,
      why: '內消旋化合物有兩個以上掌性中心，但分子本身和鏡像相同（內部有鏡面）。注意和外消旋「混合物」區分。', show: { w: 'fischer', set: { mol: 'tart', sides: ['right', 'right'] } } },
    { q: '丁烷最穩定的構形是？', o: ['反式（兩個甲基二面角 180°）', '間扭式（60°）', '甲基與甲基重疊（0°）', '甲基與氫重疊（120°）'], a: 0,
      why: '反式是交錯式，而且兩個甲基離得最遠，沒有扭轉張力也沒有立體擁擠。', show: { w: 'butane', set: { ang: 180 } } },
    { q: '甲基環己烷在室溫下，甲基主要位於？', o: ['平伏鍵（約 95%）', '直立鍵（約 95%）', '兩者各半', '環平面上'], a: 0,
      why: '甲基在直立鍵時有 1,3-雙直立作用，能量高約 7.6 kJ/mol，所以約 95% 的分子處在甲基平伏的構形。', show: { w: 'chair', set: { sub: 'me', axial: true } } },
  ],
});

/* ---------- 後中化學：互動圖 ----------
   W.名稱(el) 在 el 裡畫出互動圖，回傳 { set(狀態) } 給練習題的「在圖上看」使用。 */
const W = {};
const seg = (id, opts, cur) => `<div class="seg" id="${id}" role="group">${opts.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${t}</button>`).join('')}</div>`;
const bindSeg = (el, id, f) => $$(`#${id} button`, el).forEach(b => { b.onclick = () => f(b.dataset.v); });
const pressSeg = (el, id, v) => $$(`#${id} button`, el).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
const card = (k, lab, val, sub = '') => `<div class="card" data-k="${k}"><span>${lab}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
let UID = 0;

/* ===== 1. 滴定：燒杯（粒子）＋滴定曲線 ===== */
W.titration = (el, opt = {}) => {
  const id = 't' + (++UID), st = { acid: 'weak', v: 0, ind: opt.ind || 'none' }, Va = 25, Ca0 = 0.1, Cb = 0.1;
  el.innerHTML = `<div class="w-row">${seg(id + 'a', [['weak', '醋酸（弱酸）'], ['strong', '鹽酸（強酸）']], st.acid)}<label class="sel">指示劑 <select id="${id}i">${Object.entries(IND).map(([k, d]) => `<option value="${k}"${k === st.ind ? ' selected' : ''}>${d.name}${d.txt ? `（${d.lo}–${d.hi}，${d.txt}）` : ''}</option>`).join('')}</select></label></div>
<div class="tgrid"><div class="beaker" id="${id}b"></div><div class="tcurve" id="${id}c"></div></div>
<div class="w-row"><label class="rng">加入 NaOH <input type="range" id="${id}v" min="0" max="50" step="0.1" value="0"><output id="${id}o" class="mono"></output></label></div>
<div class="w-row">${[[-1, '−1 mL'], [-0.1, '−0.1'], [0.1, '+0.1'], [1, '+1 mL']].map(([d, t]) => `<button class="btn sm" type="button" data-d="${d}">${t}</button>`).join('')}<span class="sp"></span>${[[0, '起點'], [12.5, '半當量點'], [25, '當量點'], [30, '鹼過量']].map(([v, t]) => `<button class="btn sm ghost" type="button" data-j="${v}">${t}</button>`).join('')}</div>
<div class="cards" id="${id}k"></div><p class="note" id="${id}n" aria-live="polite"></p>`;
  const curve = strong => { const xs = []; for (let v = 0; v <= 50.001; v += (Math.abs(v - 25) < 1.2 ? 0.02 : 0.25)) xs.push(v); return xs.map(v => [v, titr({ Va, Ca0, Cb, Vb: v, strong, pKa: ACID[strong ? 'strong' : 'weak'].pKa }).pH]); };
  const CUR = { weak: curve(false), strong: curve(true) };
  function beaker(r) {
    const W0 = 230, H0 = 270, x0 = 40, x1 = 190, yb = 250, top = 70, lv = yb - (r.V / 80) * (yb - top) - 4;
    const strong = st.acid === 'strong', icons = [];
    const push = (n, cls, t) => { for (let i = 0; i < Math.round(n / 0.1); i++) icons.push([cls, t]); };
    if (strong) push(r.nH, 'ih', 'H⁺'); else push(r.nHA, 'iha', 'HA');
    if (!strong) push(r.nA, 'ia', 'A⁻');
    if (r.nOH > 0.05) push(r.nOH, 'ioh', 'OH⁻');
    const cols = 8, cw = (x1 - x0 - 12) / cols, rowH = 15;
    const g = icons.slice(0, 64).map(([c, t], i) => { const cx = x0 + 6 + cw * (i % cols + 0.5), cy = yb - 10 - rowH * Math.floor(i / cols); return `<g class="${c}"><circle cx="${cx}" cy="${cy}" r="7"/><text x="${cx}" y="${cy + 3}" text-anchor="middle">${t}</text></g>`; }).join('');
    const drops = st.v > 0 ? `<line class="burette" x1="115" y1="6" x2="115" y2="40"/><circle class="drop" cx="115" cy="52" r="3"/>` : `<line class="burette" x1="115" y1="6" x2="115" y2="40"/>`;
    return `<svg viewBox="0 0 ${W0} ${H0}" class="bk" role="img" aria-label="燒杯中的粒子">${drops}<path class="liq" d="M${x0 + 2} ${lv}L${x1 - 2} ${lv}L${x1 - 2} ${yb - 2}L${x0 + 2} ${yb - 2}Z" style="fill:${indColor(st.ind, r.pH)}"/><path class="glass" d="M${x0} ${top - 10}L${x0} ${yb}L${x1} ${yb}L${x1} ${top - 10}"/>${g}<text class="phm" x="${x1 + 4}" y="${top + 4}">pH</text><text class="phv" x="${x1 + 4}" y="${top + 26}">${fx(r.pH)}</text><text class="tk" x="${(x0 + x1) / 2}" y="${H0 - 4}" text-anchor="middle">${strong ? '每個圓 = 0.1 mmol（Na⁺、Cl⁻ 不畫）' : '每個圓 = 0.1 mmol（Na⁺ 不畫）'}</text></svg>`;
  }
  function narrate(r) {
    const strong = st.acid === 'strong', v = st.v, nOH = Cb * v, n0 = Ca0 * Va, eq = Math.abs(v - 25) < 0.05;
    if (strong) {
      if (v === 0) return `HCl 是強酸，在水中<b>完全解離</b>：[H⁺] = 0.100 M，pH = 1.00。燒杯裡的「酸」就是 2.50 mmol 的 H⁺。`;
      if (eq) return `加入的 OH⁻ 剛好中和所有 H⁺。燒杯裡只剩 Na⁺、Cl⁻ 和水，兩者都不和水反應，所以 <b>pH = 7.00</b>。`;
      if (v < 25) return `加入 ${fx(nOH, 2)} mmol OH⁻，中和等量的 H⁺，剩 ${fx(n0 - nOH, 2)} mmol H⁺ 在 ${fx(r.V, 1)} mL 中 → [H⁺] = ${sci((n0 - nOH) / r.V)} M，pH = ${fx(r.pH)}。沒有弱酸可以「接住」變化，所以沒有緩衝區。`;
      return `H⁺ 已中和完，多出 ${fx(nOH - n0, 2)} mmol OH⁻，pH 由過量的強鹼決定：${fx(r.pH)}。`;
    }
    if (v === 0) return `還沒加鹼。燒杯裡幾乎都是 HA，只有約 ${fx(100 * r.nH / n0, 1)}% 解離：[H⁺] ≈ √(Ka·C) → pH = ${fx(r.pH)}。只有一點點 A⁻，所以剛開始加鹼時比例變化很大，pH 爬得快。`;
    if (Math.abs(v - 12.5) < 0.05) return `<b>半當量點</b>：一半的 HA 變成 A⁻，HA = A⁻ = ${fx(r.nA, 2)} mmol。比例 1：1，所以 <b>pH = pKa = ${fx(r.pH)}</b>。這也是緩衝能力最強的位置。`;
    if (eq) return `<b>當量點</b>：HA 全部變成 A⁻（${fx(r.nA, 2)} mmol）。A⁻ 是弱鹼，A⁻ + H₂O ⇌ HA + OH⁻，所以溶液偏鹼，<b>pH = ${fx(r.pH)}</b>，不是 7。`;
    if (v < 23.5) return `加入 ${fx(nOH, 2)} mmol OH⁻ → 生成 ${fx(nOH, 2)} mmol A⁻，剩 ${fx(n0 - nOH, 2)} mmol HA。HA 和 A⁻ 都很多，是<b>緩衝溶液</b>：pH ≈ pKa + log(${fx(nOH, 2)} ÷ ${fx(n0 - nOH, 2)}) = ${fx(r.pH)}。`;
    if (v < 25) return `只剩 ${fx(n0 - nOH, 2)} mmol HA 了。HA 越少，每一滴鹼讓 A⁻/HA 比例改變得越劇烈，pH 開始<b>暴衝</b>。`;
    return `HA 已用完，多出 ${fx(nOH - n0, 2)} mmol OH⁻。過量強鹼產生的 OH⁻ 遠多於 A⁻ 水解產生的，pH 由過量 OH⁻ 決定：${fx(r.pH)}。這之後的曲線和強酸完全重合。`;
  }
  function draw() {
    const strong = st.acid === 'strong', r = titr({ Va, Ca0, Cb, Vb: st.v, strong, pKa: ACID[st.acid].pKa }), d = IND[st.ind];
    $('#' + id + 'b', el).innerHTML = beaker(r);
    $('#' + id + 'c', el).innerHTML = chart({ x: [0, 50], y: [0, 14], xt: [0, 10, 20, 25, 30, 40, 50], yt: [0, 2, 4, 6, 7, 8, 10, 12, 14], xlab: '加入 NaOH（mL）', ylab: 'pH', h: 290, label: '滴定曲線' }, (X, Y) =>
      (d.lo ? `<rect class="indband" x="${X(0)}" y="${Y(d.hi)}" width="${X(50) - X(0)}" height="${Y(d.lo) - Y(d.hi)}" style="fill:${indColor(st.ind, (d.lo + d.hi) / 2)}"/><text class="tk" x="${X(49)}" y="${Y(d.hi) - 4}" text-anchor="end">${d.name}變色範圍</text>` : '') +
      (strong ? '' : `<rect class="buf" data-k="buf" x="${X(25 / 11)}" y="${Y(14)}" width="${X(250 / 11) - X(25 / 11)}" height="${Y(0) - Y(14)}"/><text class="tk" x="${X(12.5)}" y="${Y(13)}" text-anchor="middle">緩衝區（pKa ± 1）</text><line class="mk" x1="${X(12.5)}" x2="${X(12.5)}" y1="${Y(0)}" y2="${Y(4.74)}"/><line class="mk" x1="${X(0)}" x2="${X(12.5)}" y1="${Y(4.74)}" y2="${Y(4.74)}"/><text class="tk" x="${X(13)}" y="${Y(4.74) + 14}">半當量點 pH = pKa</text>`) +
      `<line class="mk" x1="${X(25)}" x2="${X(25)}" y1="${Y(0)}" y2="${Y(14)}"/><text class="tk" x="${X(25.6)}" y="${Y(1)}">當量點</text>` +
      `<path class="tline" d="${path(CUR[st.acid].map(([v, p]) => [X(v), Y(p)]))}"/>${strong ? '' : `<path class="tline2" d="${path(CUR.strong.map(([v, p]) => [X(v), Y(p)]))}"/>`}<circle class="dot" cx="${X(st.v)}" cy="${Y(r.pH)}" r="7"/>`);
    $('#' + id + 'o', el).textContent = `${fx(st.v, 1)} mL`;
    $('#' + id + 'v', el).value = st.v;
    $('#' + id + 'k', el).innerHTML = card('ph', 'pH', fx(r.pH)) + (strong ? card('h', 'H⁺', `${fx(r.nH, 2)} mmol`) : card('ha', 'HA', `${fx(r.nHA, 2)} mmol`) + card('a', 'A⁻', `${fx(r.nA, 2)} mmol`)) + card('oh', '過量 OH⁻', `${fx(Math.max(0, Cb * st.v - Ca0 * Va), 2)} mmol`) + card('vt', '總體積', `${fx(r.V, 1)} mL`);
    $('#' + id + 'n', el).innerHTML = narrate(r) + (d.lo ? ` 此時${d.name}呈 <span class="sw" style="background:${indColor(st.ind, r.pH)}"></span>${r.pH < d.lo ? '酸色' : r.pH > d.hi ? '鹼色' : '過渡色'}。` : '');
    pressSeg(el, id + 'a', st.acid);
  }
  const setV = v => { st.v = Math.round(clamp(v, 0, 50) * 10) / 10; draw(); };
  bindSeg(el, id + 'a', v => { st.acid = v; draw(); });
  $('#' + id + 'v', el).oninput = e => setV(+e.target.value);
  $('#' + id + 'i', el).onchange = e => { st.ind = e.target.value; draw(); };
  $$('[data-d]', el).forEach(b => { b.onclick = () => setV(st.v + +b.dataset.d); });
  $$('[data-j]', el).forEach(b => { b.onclick = () => setV(+b.dataset.j); });
  draw();
  return { set(s) { Object.assign(st, s); if (s.ind) $('#' + id + 'i', el).value = s.ind; draw(); } };
};
W.indicator = el => W.titration(el, { ind: 'pp' });

/* ===== 2. 緩衝溶液 vs 純水 ===== */
W.buffer = el => {
  const st = { C: 0.1, net: 0 }, V = 100, step = 1;
  el.innerHTML = `<div class="w-row"><button class="btn sm" type="button" data-a="H">＋ 1 mmol HCl</button><button class="btn sm" type="button" data-a="OH">＋ 1 mmol NaOH</button><button class="btn sm ghost" type="button" data-a="0">⟲ 重來</button></div>

    const lim = 15, xs = Array.from({ length: 121 }, (_, i) => -lim + i * 2 * lim / 120);

      `<rect class="buf" x="${X(-cap)}" y="${Y(14)}" width="${X(cap) - X(-cap)}" height="${Y(0) - Y(14)}"/><text class="tk" x="${X(0)}" y="${Y(13.2)}" text-anchor="middle">緩衝容量內</text>` +

      `<circle class="dot2" cx="${X(st.net)}" cy="${Y(r.w.pH)}" r="6"/><circle class="dot" cx="${X(st.net)}" cy="${Y(r.b.pH)}" r="7"/><text class="tk" x="${X(lim) - 4}" y="${Y(calc(lim).w.pH) - 8}" text-anchor="end">純水</text><text class="tk" x="${X(-lim) + 4}" y="${Y(calc(-lim).b.pH) + 16}">緩衝溶液</text>`);

  return { set(s) { st.net = s.add === 'H' ? 1 : s.add === 'OH' ? -1 : 0; draw(); } };
};

      `<path class="sha" d="${path(xs.map(x => [X(x), Y(1 - 1 / (1 + 10 ** (pKa - x)))]))}"/><path class="sa" d="${path(xs.map(x => [X(x), Y(1 / (1 + 10 ** (pKa - x)))]))}"/>` +

/* ===== 4. 滴定曲線關鍵點的計算 ===== */
W.calc = el => {
  const Va = 25, C0 = 0.1, Cb = 0.1, pKa = 4.74, Ka = 10 ** -pKa, n0 = C0 * Va;
  const PTS = [['0', 0, '起點'], ['10', 10, '緩衝區（10.0 mL）'], ['12.5', 12.5, '半當量點'], ['25', 25, '當量點'], ['30', 30, '鹼過量（30.0 mL）']];
  let cur = '0';
  el.innerHTML = `${seg('cp', PTS.map(p => [p[0], p[2]]), cur)}<div class="calc" id="cbox"></div><div id="cmini"></div>`;
  function steps(v) {
    const nOH = Cb * v, V = Va + v, ex = titr({ Va, Ca0: C0, Cb, Vb: v, pKa });
    let main, s = [], approx;
    if (v === 0) {
      main = '只有弱酸 HA（還沒加鹼）';
      const h = Math.sqrt(Ka * C0); approx = -Math.log10(h);
      s = [`Ka = 10<sup>−${pKa}</sup> = ${sci(Ka)}`, `HA 只解離一小部分：[H⁺] ≈ √(Ka × C) = √(${sci(Ka)} × ${fx(C0, 3)})`, `= ${sci(h)} M`, `pH = −log(${sci(h)}) = <b>${fx(approx)}</b>`];
    } else if (v < 25) {
      main = 'HA 和 A⁻ 並存 → 緩衝溶液';
      const nA = nOH, nHA = n0 - nOH; approx = pKa + Math.log10(nA / nHA);
      s = [`加入 OH⁻：${fx(Cb, 3)} M × ${fx(v, 1)} mL = ${fx(nOH, 2)} mmol`, `HA + OH⁻ → A⁻ + H₂O（完全反應）`, `剩 HA = ${fx(n0, 2)} − ${fx(nOH, 2)} = ${fx(nHA, 2)} mmol；生成 A⁻ = ${fx(nA, 2)} mmol`, `pH = pKa + log(A⁻ ÷ HA) = ${pKa} + log(${fx(nA, 2)} ÷ ${fx(nHA, 2)})`, `= ${pKa} + (${fx(Math.log10(nA / nHA))}) = <b>${fx(approx)}</b>`];
      if (v === 12.5) s.push('A⁻ = HA，log 1 = 0，所以 pH 正好等於 pKa。');
    } else if (v === 25) {
      main = '只剩共軛鹼 A⁻ → 弱鹼水解';
      const C = n0 / V, Kb = 1e-14 / Ka, oh = Math.sqrt(Kb * C); approx = 14 + Math.log10(oh);
      s = [`HA 全部變成 A⁻：${fx(n0, 2)} mmol，總體積 ${fx(V, 1)} mL → [A⁻] = ${fx(C, 4)} M`, `A⁻ + H₂O ⇌ HA + OH⁻，Kb = Kw ÷ Ka = 10⁻¹⁴ ÷ ${sci(Ka)} = ${sci(Kb)}`, `[OH⁻] ≈ √(Kb × C) = √(${sci(Kb)} × ${fx(C, 4)}) = ${sci(oh)} M`, `pOH = ${fx(-Math.log10(oh))}，pH = 14 − pOH = <b>${fx(approx)}</b>`];
    } else {
      main = 'OH⁻ 過量 → 由強鹼決定';
      const exOH = nOH - n0, c = exOH / V; approx = 14 + Math.log10(c);
      s = [`加入 OH⁻ ${fx(nOH, 2)} mmol，中和 HA ${fx(n0, 2)} mmol 後多出 ${fx(exOH, 2)} mmol`, `[OH⁻] = ${fx(exOH, 2)} ÷ ${fx(V, 1)} mL = ${sci(c)} M（A⁻ 水解的貢獻小到可以忽略）`, `pOH = ${fx(-Math.log10(c))}，pH = 14 − pOH = <b>${fx(approx)}</b>`];
    }
    return { main, s, approx, exact: ex.pH, v };
  }
  function draw() {
    const v = +cur, r = steps(v);
    $('#cbox', el).innerHTML = `<p class="cq">① 燒杯裡主要是什麼？　<b>${r.main}</b></p><p class="cq">② 計算</p><ol class="cs">${r.s.map(x => `<li>${x}</li>`).join('')}</ol><p class="cq">③ 對照精確解（解電荷平衡）：pH = ${fx(r.exact)}　${Math.abs(r.exact - r.approx) < 0.03 ? '<span class="ok">✓ 近似成立</span>' : `<span class="warn">差 ${fx(Math.abs(r.exact - r.approx))}</span>`}</p>`;
    const pts = []; for (let x = 0; x <= 40.001; x += Math.abs(x - 25) < 1 ? 0.05 : 0.25) pts.push([x, titr({ Va, Ca0: C0, Cb, Vb: x, pKa }).pH]);
    $('#cmini', el).innerHTML = chart({ x: [0, 40], y: [0, 14], xt: [0, 10, 12.5, 25, 30, 40], yt: [0, 7, 14], xlab: '加入 NaOH（mL）', ylab: 'pH', h: 170, w: 560 }, (X, Y) => `<path class="tline" d="${path(pts.map(([a, b]) => [X(a), Y(b)]))}"/>${PTS.map(p => `<circle class="${p[0] === cur ? 'dot' : 'dot3'}" cx="${X(p[1])}" cy="${Y(titr({ Va, Ca0: C0, Cb, Vb: p[1], pKa }).pH)}" r="${p[0] === cur ? 7 : 4}"/>`).join('')}`);
    pressSeg(el, 'cp', cur);
  }
  bindSeg(el, 'cp', v => { cur = v; draw(); });
  draw();
  return { set(s) { cur = String(s.v ?? 0); draw(); } };
};

const subBonds = (c = 'C') => [[c, 's0', 's'], [c, 's1', 'w'], [c, 's2', 'h']];

      notes: [{ x: 0, y: -2.1, t: side === 'L' ? '構型反轉的產物' : '構型保留的產物' }] };
    return [
      { sc: F0, at: 0, cap: '<b>第一步（慢）</b>：C–Br 鍵自己斷開，兩個電子都跟著 Br 走。這一步只有鹵烷參與，決定整個反應的速率：rate = k[RX]。' },
      { sc: F1, at: 0.45, cap: '生成<b>碳陽離子</b>：中心碳只剩三個基團，攤成平面（sp²）。空的 p 軌域兩瓣朝左右，兩邊都可以接受電子。' },
      { sc: F2, at: 0.45, cap: `<b>第二步（快）</b>：水的孤對電子攻擊帶正電的碳，這次從${side === 'L' ? '左' : '右'}邊。切換上面的按鈕可以改從另一邊。` },

/* ===== 9. 紐曼投影：轉動後碳，找反式共平面 ===== */
W.newman = el => {
  let ang = 60;
  el.innerHTML = `<div class="w-row"><label class="rng">轉動後面的碳（H–C–C–Br 二面角）<input type="range" id="nwa" min="0" max="360" step="5" value="60"><output class="mono" id="nwo"></output></label></div><div class="w-row">${[0, 60, 120, 180, 240, 300].map(a => `<button class="btn sm ghost" type="button" data-a="${a}">${a}°</button>`).join('')}</div><div class="ngrid"><div id="nws"></div><p class="note" id="nwn"></p></div>`;
  function draw() {
    const cx = 150, cy = 130, R = 52, L = 98, P = (a, r) => [cx + Math.cos(a * Math.PI / 180) * r, cy - Math.sin(a * Math.PI / 180) * r];
    const front = [[90, 'H', 'hl'], [210, 'H', ''], [330, 'H', '']], back = [[90 - ang, 'Br', 'br'], [210 - ang, 'CH₃', ''], [330 - ang, 'H', '']];
    const bl = ([a, t, c]) => { const [x1, y1] = P(a, R), [x2, y2] = P(a, L); const [tx, ty] = P(a, L + 16); return `<line class="nb" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    const fl = ([a, t, c]) => { const [x2, y2] = P(a, L - 10); const [tx, ty] = P(a, L + 6); return `<line class="nb" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}"/><text class="at ${c}" x="${tx}" y="${ty + 5}" text-anchor="middle">${t}</text>`; };
    $('#nws', el).innerHTML = `<svg viewBox="0 0 300 260" class="mol" role="img" aria-label="紐曼投影式">${back.map(bl).join('')}<circle class="nc" cx="${cx}" cy="${cy}" r="${R}"/>${front.map(fl).join('')}<circle cx="${cx}" cy="${cy}" r="3" class="lp"/></svg>`;
    const d = ((ang % 360) + 360) % 360, anti = Math.abs(d - 180) <= 10, syn = d <= 10 || d >= 350;
    $('#nwn', el).innerHTML = `前面的碳（β 碳）：紅色的 H；後面的碳：Br。二面角 ${d}°。<br>` + (anti ? '<span class="ok">✓ 反式共平面</span>：H 和 Br 在相反兩側且同一平面，C–H 的電子可以順利推進 C–Br 的反鍵結軌域，<b>E2 可以發生</b>。這也是交錯式構形，能量低。'
      : syn ? '<span class="warn">順式共平面</span>：理論上軌域也平行，但這是重疊式構形，H 和 Br 擠在一起，能量很高，很少經由這個構形反應。'
        : '<span class="bad">✕ 不行</span>：C–H 和 C–Br 沒有平行，電子推不過去。分子要先轉到 180°（反式共平面）才能進行 E2。');
    $('#nwo', el).textContent = `${d}°`; $('#nwa', el).value = d;
  }
  $('#nwa', el).oninput = e => { ang = +e.target.value; draw(); };
  $$('[data-a]', el).forEach(b => { b.onclick = () => { ang = +b.dataset.a; draw(); }; });
  draw();
  return { set(s) { ang = s.ang ?? ang; draw(); } };
};

      bonds: [['Cb', 'Ca', 'd'], ['Cb', 'b1', 's'], ['Cb', 'b2', 's'], ['Ca', 'm1', 's'], ['Ca', 'm2', 's'], ['O', 'H', 's']], notes: [{ x: 0, y: -2.0, t: '2-甲基丙烯 + H₃O⁺' }] };
    return [

      { sc: F1, at: 0.45, cap: '生成三級碳陽離子。接下來它可以被水加上去（SN1），也可以失去 β-H（E1）。' },

      { sc: F3, at: 1, cap: '產物：2-甲基丙烯 + H₃O⁺ + Br⁻。一個分子變成三個，熵增加，所以加熱有利於 E1。' }];

/* ===== 12. 判斷器 ===== */
W.decide = el => {
  const st = { sub: 'secondary', reag: 'base', solv: 'protic', heat: false };
  const SUB = { methyl: '甲基（CH₃X）', primary: '一級（RCH₂X）', secondary: '二級（R₂CHX）', tertiary: '三級（R₃CX）' };
  const REAG = { nuc: '強親核、弱鹼（I⁻、Br⁻、RS⁻、N₃⁻、CN⁻）', base: '強鹼、強親核（OH⁻、RO⁻）', bulky: '體積大的強鹼（t-BuO⁻）', weak: '弱親核、弱鹼（H₂O、ROH）' };
  const SOLV = { protic: '極性質子性（水、醇）', aprotic: '極性非質子性（丙酮、DMSO、DMF）' };
  el.innerHTML = `<p class="lbl">基質</p>${seg('ds', Object.entries(SUB), st.sub)}<p class="lbl">試劑</p>${seg('dr', Object.entries(REAG), st.reag)}<p class="lbl">溶劑</p>${seg('dv', Object.entries(SOLV), st.solv)}<label class="chk"><input type="checkbox" id="dh"> 加熱</label><div class="verdict" id="dv0"></div><ol class="reason" id="dl"></ol>`;
  function decide({ sub, reag, solv, heat }) {
    const s = [];
    s.push({ methyl: '甲基：背面最空，最適合 SN2；沒有 β-H，不能脫去；甲基碳陽離子極不穩定，不走 SN1／E1。', primary: '一級：背面還算空，SN2 容易；一級碳陽離子很不穩定，不走 SN1／E1。', secondary: '二級：背面有點擠、碳陽離子中等穩定，四條路都有可能，關鍵看試劑。', tertiary: '三級：背面被三個基團擋住，不走 SN2；碳陽離子穩定，可以走 SN1／E1；也有很多 β-H 可以做 E2。' }[sub]);
    s.push({ nuc: '試劑是好的親核基但鹼性弱：傾向去攻擊碳（取代），不太去拿 H（脫去）。', base: '試劑是強鹼，也是強親核基：取代和脫去互相競爭，基質越擠越偏向脫去。', bulky: '試劑是體積很大的強鹼：擠不到碳旁邊做取代，幾乎只拿外側的 β-H 做 E2。', weak: '試劑是弱親核、弱鹼：推不動 SN2，也拿不動 H 做 E2，只能等鹵烷自己解離成碳陽離子（SN1／E1）。' }[reag]);
    let major, minor = '';
    if (sub === 'methyl') { major = reag === 'weak' ? '幾乎不反應' : 'SN2'; if (reag === 'bulky') s.push('沒有 β-H 可以拿，t-BuO⁻ 只能很慢地做 SN2。'); if (reag === 'weak') s.push('弱親核基推不動 SN2，甲基碳陽離子又生不出來。'); }
    else if (sub === 'primary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'SN2'; minor = 'E2'; s.push('一級背面夠空，強鹼大多直接當親核基做 SN2；加熱會讓 E2 比例上升。'); }
      else if (reag === 'bulky') { major = 'E2'; minor = 'SN2'; } else { major = '幾乎不反應'; s.push('一級碳陽離子太不穩定，弱親核基又推不動 SN2。'); }
    } else if (sub === 'secondary') {
      if (reag === 'nuc') major = 'SN2'; else if (reag === 'base') { major = 'E2'; minor = 'SN2'; s.push('二級背面有點擠，強鹼拿 β-H 比擠進背面容易，所以 E2 為主。'); }
      else if (reag === 'bulky') major = 'E2';
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; s.push('二級碳陽離子勉強可以生成，反應很慢，而且產物是取代和脫去的混合物。'); }
    } else {
      if (reag === 'nuc') { major = solv === 'protic' ? 'SN1' : 'SN1（很慢）'; minor = 'E1'; s.push(solv === 'protic' ? '背面被擋住只能走 SN1：先解離成碳陽離子，親核基再加上去。' : 'SN1 需要極性質子性溶劑幫忙穩定生成的離子；在非質子性溶劑中解離很慢。'); }
      else if (reag === 'base') { major = 'E2'; s.push('強鹼不必等碳陽離子生成，直接拿 β-H 做 E2，比 SN1 快得多。'); }
      else if (reag === 'bulky') { major = 'E2'; s.push('大體積的鹼拿外側的 H，霍夫曼產物（取代較少的烯）比例較高。'); }
      else { major = heat ? 'E1' : 'SN1'; minor = heat ? 'SN1' : 'E1'; }
    }
    if (/SN2/.test(major)) s.push(solv === 'aprotic' ? '溶劑是非質子性：不會用氫鍵包住親核基，親核基更有攻擊力，有利 SN2。' : '溶劑是質子性：會用氫鍵包住親核基，SN2 會變慢一些；換成丙酮、DMSO 會更快。');
    if (/SN1|E1/.test(major) && solv === 'protic') s.push('溶劑是極性質子性：能穩定碳陽離子和 X⁻，幫助第一步解離。');
    if (heat && /SN1|E1|SN2|E2/.test(major)) s.push(/E1|E2/.test(major) ? '加熱：脫去讓分子數增加（熵增加），高溫更有利於脫去。' : '加熱：會提高脫去產物的比例。');
    return { major, minor, s };
  }
  function draw() {
    const r = decide(st);
    $('#dv0', el).innerHTML = `<span class="lbl">主要</span><b class="big">${r.major}</b>${r.minor ? `<span class="lbl">次要</span><b>${r.minor}</b>` : ''}`;
    $('#dl', el).innerHTML = r.s.map(x => `<li>${x}</li>`).join('');
    pressSeg(el, 'ds', st.sub); pressSeg(el, 'dr', st.reag); pressSeg(el, 'dv', st.solv); $('#dh', el).checked = st.heat;
  }
  bindSeg(el, 'ds', v => { st.sub = v; draw(); }); bindSeg(el, 'dr', v => { st.reag = v; draw(); }); bindSeg(el, 'dv', v => { st.solv = v; draw(); });
  $('#dh', el).onchange = e => { st.heat = e.target.checked; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ---------- 後中化學：化學平衡的互動圖 ----------
   N₂O₄ ⇌ 2 NO₂：25 °C 時 Kc ≈ 4.6 × 10⁻³（濃度以 M 計），ΔH° ≈ +57.2 kJ/mol（正反應吸熱）。K 隨溫度依 van 't Hoff 式變化。 */
const N2O4 = { K298: 4.6e-3, dH: 57.2e3, R: 8.314 };
const Kat = T => N2O4.K298 * Math.exp(-N2O4.dH / N2O4.R * (1 / T - 1 / 298.15));
// 從 [N₂O₄] = a、[NO₂] = b 出發達到平衡：(b + 2x)² = K(a − x)，取物理上合理的根
function eqSolve(a, b, K) { const B = 4 * b + K, C = b * b - K * a, x = (-B + Math.sqrt(B * B - 16 * C)) / 8; return { a: a - x, b: b + 2 * x, x }; }

/* ===== 1. 動態平衡：A ⇌ B ===== */
W.eqdyn = el => {
  const st = { kf: 0.6, kr: 0.2, t: 2, fromB: false }, T = 12;
  el.innerHTML = `<div class="w-row">${seg('edS', [['A', '從純 A 開始'], ['B', '從純 B 開始']], 'A')}</div>
<div class="w-row"><label class="rng">正反應 k<sub>f</sub> <input type="range" id="edf" min="0.05" max="1.5" step="0.05"><output class="mono" id="edfo"></output></label><label class="rng">逆反應 k<sub>r</sub> <input type="range" id="edr" min="0.05" max="1.5" step="0.05"><output class="mono" id="edro"></output></label></div>
<div class="w-row"><label class="rng">時間 <input type="range" id="edt" min="0" max="${T}" step="0.1"><output class="mono" id="edto"></output></label></div>
<div class="bgrid"><div id="edc"></div><div id="edv"></div></div><div class="cards" id="edk"></div><p class="note" id="edn"></p>`;
  const conc = t => { const s = st.kf + st.kr, Aeq = st.kr / s, A0 = st.fromB ? 0 : 1, A = Aeq + (A0 - Aeq) * Math.exp(-s * t); return [A, 1 - A]; };
  function draw() {
    const ts = Array.from({ length: 121 }, (_, i) => i * T / 120), [A, B] = conc(st.t), K = st.kf / st.kr;
    $('#edc', el).innerHTML = chart({ x: [0, T], y: [0, 1], xt: [0, 3, 6, 9, 12], yt: [0, 0.5, 1], xlab: '時間', ylab: '濃度（M）', h: 220, label: '濃度隨時間' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(1)}"/><circle class="dot2" cx="${X(st.t)}" cy="${Y(A)}" r="5"/><circle class="dot" cx="${X(st.t)}" cy="${Y(B)}" r="5"/><text class="tk lha" x="${X(0.3)}" y="${Y(st.fromB ? 0.06 : 0.93)}">[A]</text><text class="tk la" x="${X(0.3)}" y="${Y(st.fromB ? 0.93 : 0.06)}">[B]</text>`);
    const rmax = Math.max(st.kf, st.kr);
    $('#edv', el).innerHTML = chart({ x: [0, T], y: [0, rmax], xt: [0, 3, 6, 9, 12], yt: [0, +(rmax / 2).toFixed(2), +rmax.toFixed(2)], xlab: '時間', ylab: '反應速率', h: 220, label: '正逆反應速率' }, (X, Y) =>
      `<path class="sha" d="${path(ts.map(t => [X(t), Y(st.kf * conc(t)[0])]))}"/><path class="sa" d="${path(ts.map(t => [X(t), Y(st.kr * conc(t)[1])]))}"/><line class="cur" x1="${X(st.t)}" x2="${X(st.t)}" y1="${Y(0)}" y2="${Y(rmax)}"/><text class="tk lha" x="${X(T) - 4}" y="${Y(rmax) + 12}" text-anchor="end">藍：正反應 k<tspan dy="3" font-size="9">f</tspan><tspan dy="-3">[A]</tspan></text><text class="tk la" x="${X(T) - 4}" y="${Y(rmax) + 26}" text-anchor="end">橘：逆反應 k<tspan dy="3" font-size="9">r</tspan><tspan dy="-3">[B]</tspan></text>`);
    const Q = A > 1e-9 ? B / A : Infinity, rf = st.kf * A, rr = st.kr * B, eq = Math.abs(rf - rr) < 0.005;
    $('#edk', el).innerHTML = card('q', 'Q = [B] ÷ [A]', Number.isFinite(Q) ? fx(Q) : '∞') + card('k', 'K = k<sub>f</sub> ÷ k<sub>r</sub>', fx(K)) + card('rf', '正反應速率', fx(rf, 3)) + card('rr', '逆反應速率', fx(rr, 3));
    $('#edn', el).innerHTML = eq ? `<b>已達平衡</b>：正逆反應速率相等（都是 ${fx(rf, 3)}），所以濃度不再改變；但兩個反應都還在進行，只是互相抵消。此時 Q = K = ${fx(K)}。`
      : `尚未平衡：${rf > rr ? '正反應比逆反應快，A 持續變成 B' : '逆反應比正反應快，B 持續變回 A'}，Q（${Number.isFinite(Q) ? fx(Q) : '∞'}）${Q < K ? '小於' : '大於'} K（${fx(K)}）。`;
    $('#edfo', el).textContent = fx(st.kf); $('#edro', el).textContent = fx(st.kr); $('#edto', el).textContent = fx(st.t, 1);
    $('#edf', el).value = st.kf; $('#edr', el).value = st.kr; $('#edt', el).value = st.t; pressSeg(el, 'edS', st.fromB ? 'B' : 'A');
  }
  $('#edf', el).oninput = e => { st.kf = +e.target.value; draw(); };
  $('#edr', el).oninput = e => { st.kr = +e.target.value; draw(); };
  $('#edt', el).oninput = e => { st.t = +e.target.value; draw(); };
  bindSeg(el, 'edS', v => { st.fromB = v === 'B'; draw(); });
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 2. Q 與 K、ICE 表 ===== */
W.qk = el => {
  const st = { a: 0.1, b: 0 }, K = N2O4.K298;
  el.innerHTML = `<p class="eq">N₂O₄(g) ⇌ 2 NO₂(g)　　K = [NO₂]² ÷ [N₂O₄] = 4.6 × 10⁻³（25 °C）</p>
<div class="w-row"><label class="rng">起始 [N₂O₄] <input type="range" id="qka" min="0" max="0.5" step="0.005"><output class="mono" id="qkao"></output></label><label class="rng">起始 [NO₂] <input type="range" id="qkb" min="0" max="0.1" step="0.001"><output class="mono" id="qkbo"></output></label></div>
<div class="bgrid"><div id="qkq"></div><div id="qkt"></div></div><div id="qkbar"></div><p class="note" id="qkn"></p>`;
  function draw() {
    const { a, b } = st, Q = a > 0 ? b * b / a : Infinity, r = eqSolve(a, b, K), dir = Math.abs(Math.log10((Q || 1e-12) / K)) < 0.01 ? 0 : Q < K ? 1 : -1;
    $('#qkao', el).textContent = `${fx(a, 3)} M`; $('#qkbo', el).textContent = `${fx(b, 3)} M`; $('#qka', el).value = a; $('#qkb', el).value = b;
    const lq = Number.isFinite(Q) && Q > 0 ? Math.log10(Q) : (Q === 0 ? -6 : 2), lk = Math.log10(K);
    $('#qkq', el).innerHTML = chart({ x: [-6, 2], y: [0, 1], xt: [-6, -4, -2, 0, 2], yt: [], xlab: 'log Q（左：幾乎都是反應物；右：產物多）', h: 120, label: 'Q 與 K 的比較' }, (X, Y) =>
      `<line class="mk" x1="${X(lk)}" x2="${X(lk)}" y1="${Y(0)}" y2="${Y(1)}"/><text class="tk hl" x="${X(lk)}" y="${Y(0.85)}" text-anchor="middle">K</text><circle class="dot" cx="${X(Math.max(-6, Math.min(2, lq)))}" cy="${Y(0.4)}" r="7"/><text class="tk" x="${X(Math.max(-6, Math.min(2, lq)))}" y="${Y(0.4) - 12}" text-anchor="middle">Q</text>${dir ? `<path class="arr" d="M${X(Math.max(-6, Math.min(2, lq))) + dir * 12} ${Y(0.4)}L${X(lk) - dir * 8} ${Y(0.4)}" marker-end="url(#ah2)"/>` : ''}<defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--arrow)"/></marker></defs>`);
    const f = v => fx(v, 4);
    $('#qkt', el).innerHTML = `<table class="tbl ice"><thead><tr><th></th><th>[N₂O₄]</th><th>[NO₂]</th></tr></thead><tbody>
<tr><td>I 起始</td><td>${f(a)}</td><td>${f(b)}</td></tr><tr><td>C 變化</td><td>${r.x >= 0 ? '−' : '+'}x = ${r.x >= 0 ? '−' : '+'}${f(Math.abs(r.x))}</td><td>${r.x >= 0 ? '+' : '−'}2x = ${r.x >= 0 ? '+' : '−'}${f(Math.abs(2 * r.x))}</td></tr>
<tr><td>E 平衡</td><td><b>${f(r.a)}</b></td><td><b>${f(r.b)}</b></td></tr></tbody></table><p class="small mut">驗算：[NO₂]² ÷ [N₂O₄] = ${r.a > 0 ? sci(r.b * r.b / r.a) : '—'}</p>`;
    const mx = Math.max(a, b, r.a, r.b, 0.01);
    $('#qkbar', el).innerHTML = `<div class="bars"><div><span>起始 N₂O₄</span><i class="bha" style="width:${100 * a / mx}%"></i><b class="mono">${fx(a, 3)}</b></div><div><span>平衡 N₂O₄</span><i class="bha" style="width:${100 * r.a / mx}%"></i><b class="mono">${fx(r.a, 3)}</b></div><div><span>起始 NO₂</span><i class="ba" style="width:${100 * b / mx}%"></i><b class="mono">${fx(b, 3)}</b></div><div><span>平衡 NO₂</span><i class="ba" style="width:${100 * r.b / mx}%"></i><b class="mono">${fx(r.b, 3)}</b></div></div>`;
    $('#qkn', el).innerHTML = a === 0 && b === 0 ? '容器是空的，沒有反應。' : dir === 0 ? '<b>Q = K</b>：已經在平衡，濃度不會改變。'
      : `Q = ${Number.isFinite(Q) ? sci(Q) : '∞'}，${dir > 0 ? `<b>Q &lt; K</b>：產物太少，反應<b>向右</b>進行（N₂O₄ 分解），直到 Q 增加到 K。` : `<b>Q &gt; K</b>：產物太多，反應<b>向左</b>進行（NO₂ 結合），直到 Q 降到 K。`}設變化量為 x，代入 K 的式子解出 x = ${fx(r.x, 4)} M。`;
  }
  $('#qka', el).oninput = e => { st.a = +e.target.value; draw(); };
  $('#qkb', el).oninput = e => { st.b = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 3. 勒沙特列原理：干擾後先看 Q，再看系統怎麼回到平衡 ===== */
W.lechat = el => {
  let st, hist;
  const reset = () => { const r = eqSolve(0.1, 0, Kat(298.15)); st = { T: 298.15, V: 1, nN: r.a, nB: r.b, phase: 'eq', msg: '' }; hist = [{ N: r.a, B: r.b, lab: '起始平衡' }]; };
  reset();
  const ACT = { addN: '加入 N₂O₄', addB: '加入 NO₂', comp: '體積減半（加壓）', exp: '體積加倍（減壓）', heat: '加熱 +30 °C', cool: '冷卻 −30 °C' };
  el.innerHTML = `<div class="w-row">${Object.entries(ACT).map(([k, t]) => `<button class="btn sm" type="button" data-a="${k}">${t}</button>`).join('')}<button class="btn sm ghost" type="button" data-a="reset">⟲ 重來</button></div>
<div class="bgrid"><div id="lcs"></div><div class="cards" id="lck"></div></div><div class="w-row"><button class="btn sm pri" type="button" id="lcgo" disabled>讓系統回到平衡 →</button></div><div id="lch"></div><p class="note" id="lcn" aria-live="polite"></p>`;
  const conc = () => ({ a: st.nN / st.V, b: st.nB / st.V });
  function draw() {
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a, eq = st.phase === 'eq';
    // 針筒：寬度 ∝ 體積，顏色深淺 ∝ [NO₂]（紅棕色）
    const w = 60 + 110 * st.V, op = Math.min(0.95, b / 0.06);
    $('#lcs', el).innerHTML = `<svg viewBox="0 0 280 120" class="bk" role="img" aria-label="裝氣體的針筒"><rect x="20" y="30" width="230" height="60" rx="6" fill="none" stroke="var(--muted)" stroke-width="2"/><rect x="22" y="32" width="${w}" height="56" fill="rgb(150,60,20)" fill-opacity="${op.toFixed(2)}"/><rect x="${22 + w}" y="26" width="8" height="68" fill="var(--muted)"/><rect x="${30 + w}" y="56" width="${230 - w}" height="8" fill="var(--muted)"/><text class="tk" x="24" y="110">顏色越深 = NO₂ 越濃；${fx(st.T - 273.15, 0)} °C、${fx(st.V, 2)} L</text></svg>`;
    $('#lck', el).innerHTML = card('a', '[N₂O₄]', fx(a, 4)) + card('b', '[NO₂]', fx(b, 4)) + card('q', 'Q', sci(Q)) + card('k', `K（${fx(st.T - 273.15, 0)} °C）`, sci(K));
    $('#lcgo', el).disabled = eq;
    const pts = hist, mx = Math.max(...pts.flatMap(p => [p.N, p.B])) * 1.1;
    $('#lch', el).innerHTML = chart({ x: [0, Math.max(4, pts.length - 1)], y: [0, mx], xt: [], yt: [0, +(mx / 2).toFixed(3), +mx.toFixed(3)], xlab: '事件順序（每次干擾 → 回到平衡）', ylab: '濃度（M）', h: 200, label: '濃度變化歷程' }, (X, Y) =>
      `<path class="sha" d="${path(pts.map((p, i) => [X(i), Y(p.N)]))}"/><path class="sa" d="${path(pts.map((p, i) => [X(i), Y(p.B)]))}"/>${pts.map((p, i) => `<circle class="dot3" cx="${X(i)}" cy="${Y(p.N)}" r="3"/><circle class="dot2" cx="${X(i)}" cy="${Y(p.B)}" r="3"/>`).join('')}<text class="tk lha" x="${X(0) + 4}" y="${Y(pts[0].N) - 6}">N₂O₄</text><text class="tk la" x="${X(0) + 4}" y="${Y(pts[0].B) + 14}">NO₂</text>`);
    $('#lcn', el).innerHTML = st.msg || '系統在平衡。選一種干擾，先看 Q 和 K 的關係，再按「讓系統回到平衡」。';
  }
  function act(k) {
    if (k === 'reset') { reset(); draw(); return; }
    if (st.phase !== 'eq') relax();
    const K0 = Kat(st.T);
    if (k === 'addN') st.nN += 0.05; if (k === 'addB') st.nB += 0.02;
    if (k === 'comp') st.V /= 2; if (k === 'exp') st.V *= 2;
    if (k === 'heat') st.T += 30; if (k === 'cool') st.T -= 30;
    st.V = clamp(st.V, 0.125, 2); st.T = clamp(st.T, 238.15, 388.15);
    const { a, b } = conc(), K = Kat(st.T), Q = b * b / a;
    hist.push({ N: a, B: b, lab: ACT[k] });
    const why = { addN: '加入反應物 N₂O₄，分母變大，Q 變小', addB: '加入產物 NO₂，分子變大，Q 變大', comp: '體積減半，兩者濃度都加倍；但 [NO₂] 是平方，所以 Q 變成原本的 2 倍', exp: '體積加倍，兩者濃度都減半；Q 變成原本的一半', heat: `Q 沒變，但正反應吸熱，升溫讓 K 從 ${sci(K0)} 變大到 ${sci(K)}`, cool: `Q 沒變，但降溫讓 K 從 ${sci(K0)} 變小到 ${sci(K)}` }[k];
    st.phase = 'pert';
    st.msg = `<b>${ACT[k]}</b>：${why}。現在 Q = ${sci(Q)}，K = ${sci(K)}，<b>Q ${Q < K ? '&lt;' : '&gt;'} K</b> → 系統會<b>${Q < K ? '向右（產生更多 NO₂）' : '向左（產生更多 N₂O₄）'}</b>移動。${k === 'comp' ? '向左可以減少氣體分子數（2 個 NO₂ → 1 個 N₂O₄），部分抵銷加壓。注意顏色：先因為變濃而加深，回到平衡時再稍微變淡。' : k === 'exp' ? '向右可以增加氣體分子數，部分抵銷減壓。' : ''}`;
    draw();
  }
  function relax() {
    const { a, b } = conc(), r = eqSolve(a, b, Kat(st.T));
    st.nN = r.a * st.V; st.nB = r.b * st.V; st.phase = 'eq';
    hist.push({ N: r.a, B: r.b, lab: '回到平衡' });
    st.msg = `回到平衡：[N₂O₄] = ${fx(r.a, 4)}、[NO₂] = ${fx(r.b, 4)} M，Q 又等於 K。系統只能<b>部分抵銷</b>干擾，不會完全回到原來的濃度。`;
  }
  $$('[data-a]', el).forEach(b => { b.onclick = () => act(b.dataset.a); });
  $('#lcgo', el).onclick = () => { relax(); draw(); };
  draw();
  return { set(s) { reset(); if (s.act) act(s.act); draw(); } };
};

/* ===== 4. ΔG° 與 K ===== */
W.kdg = el => {
  const st = { dG: -5.7, T: 298 };
  el.innerHTML = `<div class="w-row"><label class="rng">ΔG°（kJ/mol） <input type="range" id="kgd" min="-40" max="40" step="0.1"><output class="mono" id="kgdo"></output></label><label class="rng">溫度（K） <input type="range" id="kgt" min="250" max="500" step="1"><output class="mono" id="kgto"></output></label></div><div id="kgc"></div><div id="kgb"></div><div class="cards" id="kgk"></div><p class="note" id="kgn"></p>`;
  function draw() {
    const R = 8.314e-3, K = Math.exp(-st.dG / (R * st.T)), fB = K / (1 + K), xs = Array.from({ length: 161 }, (_, i) => -40 + i * 0.5);
    $('#kgdo', el).textContent = fx(st.dG, 1); $('#kgto', el).textContent = st.T; $('#kgd', el).value = st.dG; $('#kgt', el).value = st.T;
    $('#kgc', el).innerHTML = chart({ x: [-40, 40], y: [-8, 8], xt: [-40, -20, 0, 20, 40], yt: [-8, -4, 0, 4, 8], xlab: 'ΔG°（kJ/mol）', ylab: 'log K', h: 220, label: 'ΔG° 與 log K' }, (X, Y) =>
      `<line class="mk" x1="${X(-40)}" x2="${X(40)}" y1="${Y(0)}" y2="${Y(0)}"/><line class="mk" x1="${X(0)}" x2="${X(0)}" y1="${Y(-8)}" y2="${Y(8)}"/><path class="tline" d="${path(xs.map(x => [X(x), Y(clamp(-x / (R * st.T) / Math.LN10, -8, 8))]))}"/><circle class="dot" cx="${X(st.dG)}" cy="${Y(clamp(Math.log10(K), -8, 8))}" r="7"/>`);
    $('#kgb', el).innerHTML = `<div class="stack"><i class="bha" style="width:${100 - 100 * fB}%">${100 - 100 * fB >= 10 ? `A ${fx(100 - 100 * fB, 1)}%` : ''}</i><i class="ba" style="width:${100 * fB}%">${100 * fB >= 10 ? `B ${fx(100 * fB, 1)}%` : ''}</i></div><p class="small mut">A ⇌ B 達到平衡時的組成</p>`;
    $('#kgk', el).innerHTML = card('k', 'K = e<sup>−ΔG°/RT</sup>', sci(K)) + card('l', 'log K', fx(Math.log10(K)));
    $('#kgn', el).innerHTML = Math.abs(st.dG) < 0.3 ? 'ΔG° ≈ 0：K ≈ 1，平衡時 A 和 B 差不多一樣多。'
      : `ΔG° ${st.dG < 0 ? '為負' : '為正'}，K ${st.dG < 0 ? '大於' : '小於'} 1：平衡時${st.dG < 0 ? '產物 B' : '反應物 A'}較多。在 ${st.T} K，ΔG° 每改變 ${fx(R * st.T * Math.LN10, 1)} kJ/mol，K 就差 10 倍，所以幾十 kJ/mol 的差別就讓反應幾乎完全偏向一邊。`;
  }
  $('#kgd', el).oninput = e => { st.dG = +e.target.value; draw(); };
  $('#kgt', el).oninput = e => { st.T = +e.target.value; draw(); };
  draw();
  return { set(s) { Object.assign(st, s); draw(); } };
};

/* ===== 1. 初速率法：自己做實驗找出反應級數 ===== */
W.ratelaw = el => {
  const RX = {
    no: { n: '2NO + O₂ → 2NO₂', A: 'NO', B: 'O₂', m: 2, n2: 1 },
    sn1: { n: '(CH₃)₃CBr + OH⁻ → (CH₃)₃COH + Br⁻', A: '(CH₃)₃CBr', B: 'OH⁻', m: 1, n2: 0 },
    sn2: { n: 'CH₃Br + OH⁻ → CH₃OH + Br⁻', A: 'CH₃Br', B: 'OH⁻', m: 1, n2: 1 },
  };
  let cur = 'no', A = 0.1, B = 0.1, rows = [], gm = null, gn = null;
  el.innerHTML = `${seg('rlS', Object.entries(RX).map(([k, v]) => [k, v.n]), cur)}<div class="w-row" id="rlC"></div><div class="w-row"><button class="btn sm pri" type="button" id="rlGo">做實驗：量初速率</button><button class="btn sm ghost" type="button" id="rlR">清除紀錄</button></div><div id="rlT"></div><div class="w-row" id="rlG"></div><p class="note" id="rlN"></p>`;

    const r = RX[cur];

    $$('[data-c]', el).forEach(b => { b.onclick = () => { const f = +b.dataset.f; if (b.dataset.c === 'A') A = clamp(A * f, 0.0125, 0.8); else B = clamp(B * f, 0.0125, 0.8); draw(); }; });
    const r0 = rows[0];
    $('#rlT', el).innerHTML = rows.length ? `<table class="tbl"><thead><tr><th>實驗</th><th>[${r.A}]（M）</th><th>[${r.B}]（M）</th><th>初速率（相對）</th></tr></thead><tbody>${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${fx(x.a, 3)}</td><td>${fx(x.b, 3)}</td><td class="mono">${fx(x.r / r0.r, 2)}</td></tr>`).join('')}</tbody></table>` : '<p class="small mut">還沒有實驗紀錄。調整濃度後按「做實驗」。技巧：每次只改變一種反應物的濃度。</p>';
    $('#rlG', el).innerHTML = `<span class="small">你的猜測：rate = k[${r.A}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gm === v ? ' pri' : ''}" type="button" data-gm="${v}">${v}</button>`).join('')}<span class="small">[${r.B}]</span>${[0, 1, 2].map(v => `<button class="btn sm${gn === v ? ' pri' : ''}" type="button" data-gn="${v}">${v}</button>`).join('')}`;
    $$('[data-gm]', el).forEach(b => { b.onclick = () => { gm = +b.dataset.gm; draw(); }; });
    $$('[data-gn]', el).forEach(b => { b.onclick = () => { gn = +b.dataset.gn; draw(); }; });
    let msg = '先做至少三次實驗：一次當基準，一次只把第一種反應物加倍，一次只把第二種加倍。';
    if (gm != null && gn != null) msg = gm === r.m && gn === r.n2 ? `<span class="ok">✓ 正確</span>：rate = k[${r.A}]${r.m > 1 ? `<sup>${r.m}</sup>` : r.m ? '' : '⁰'}[${r.B}]${r.n2 > 1 ? `<sup>${r.n2}</sup>` : r.n2 ? '' : '⁰'}，總級數 ${r.m + r.n2}。${cur === 'sn1' ? '速率和 OH⁻ 無關：這正是 SN1，最慢的一步只有鹵烷參與。' : cur === 'sn2' ? '兩者都是一級：SN2 的過渡狀態同時包含兩者。' : '注意級數不等於方程式的係數也可以；這裡剛好相同，但必須由實驗決定。'}`
      : `<span class="bad">還不對</span>。找兩次「只有 [${r.A}] 不同」的實驗：濃度變 2 倍時速率變幾倍？2¹ = 2 → 一級；2² = 4 → 二級；不變 → 零級。`;

  return { set(s) { if (s.rx) { cur = s.rx; rows = []; } (s.rows || []).forEach(([a, b]) => rows.push({ a, b, r: rate(a, b) })); gm = s.gm ?? gm; gn = s.gn ?? gn; draw(); } };
